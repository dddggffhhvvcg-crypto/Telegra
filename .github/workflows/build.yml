                              Spacer(Modifier.height(10.dp))
                              OutlinedTextField(
                                  value = newUsername,
                                  onValueChange = { newUsername = it.filter { c -> c.isLetterOrDigit() || c == '_' } },
                                  label = { Text("@юзернейм") },
                                  singleLine = true
                              )
                          }
                      },
                      confirmButton = {
                          TextButton(
                              onClick = {
                                  if (newName.isNotBlank() && newUsername.length >= 4) {
                                      onUpdateUser(user.copy(name = newName.trim(), username = newUsername.trim()))
