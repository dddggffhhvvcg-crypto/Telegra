          @Composable
          fun SearchByUsernameScreen(
              directory: List<UserAccount>,
              theme: AppThemeMode,
              onOpenOrStartChat: (UserAccount) -> Unit
          ) {
              var query by remember { mutableStateOf("") }
              val cleanQuery = query.removePrefix("@").trim()

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(horizontal = 20.dp, vertical = 18.dp)
              ) {
                  Text(
                      text = "Поиск",
                      color = theme.textMain,
                      fontSize = 28.sp,
                      fontWeight = FontWeight.Bold
                  )
                  Spacer(Modifier.height(14.dp))

                  MockupInputField(
                      value = query,
                      onValueChange = { query = it },
                      placeholder = "Поиск по @юзернейму или имени...",
                      leadingIcon = Icons.Default.Search,
                      theme = theme
                  )

                  Spacer(Modifier.height(18.dp))

                  if (cleanQuery.length >= 3 && directory.none { it.username.equals(cleanQuery, true) }) {
                      Surface(
                          color = theme.card,
                          shape = RoundedCornerShape(16.dp),
                          border = BorderStroke(1.dp, theme.stroke),
                          modifier = Modifier
                              .fillMaxWidth()
                              .clickable {
                                  onOpenOrStartChat(
                                      UserAccount(
                                          name = cleanQuery.replaceFirstChar { it.uppercase() },
                                          username = cleanQuery
                                      )
                                  )
                              }
                      ) {
                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              modifier = Modifier.padding(14.dp)
                          ) {
                              AvatarView(title = cleanQuery, bitmap = null, size = 46, theme = theme)
                              Spacer(Modifier.width(12.dp))
                              Column(modifier = Modifier.weight(1f)) {
                                  Text(
                                      text = "Написать @$cleanQuery",
                                      color = theme.textMain,
                                      fontWeight = FontWeight.Bold,
                                      fontSize = 15.sp
                                  )
                                  Text(
                                      text = "@$cleanQuery",
                                      color = theme.accent,
                                      fontSize = 13.sp
                                  )
                              }
                              Icon(Icons.AutoMirrored.Filled.Send, contentDescription = null, tint = theme.accent)
                          }
                      }
                      Spacer(Modifier.height(12.dp))
                  }

                  val filteredUsers = directory.filter {
                      cleanQuery.isEmpty() ||
                              it.username.contains(cleanQuery, true) ||
                              it.name.contains(cleanQuery, true)
                  }

                  LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      items(filteredUsers) { item ->
                          Surface(
                              color = theme.card,
                              shape = RoundedCornerShape(16.dp),
                              border = BorderStroke(1.dp, theme.stroke),
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clickable { onOpenOrStartChat(item) }
                          ) {
                              Row(
                                  verticalAlignment = Alignment.CenterVertically,
                                  modifier = Modifier.padding(14.dp)
                              ) {
                                  AvatarView(title = item.name, bitmap = item.avatarBitmap, size = 48, theme = theme)
                                  Spacer(Modifier.width(14.dp))
                                  Column(modifier = Modifier.weight(1f)) {
                                      Text(item.name, color = theme.textMain, fontWeight = FontWeight.Bold, fontSize = 16.sp)
                                      Text("@${item.username}", color = theme.accent, fontSize = 13.sp)
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun CreateOrEditChannelDialog(
              theme: AppThemeMode,
              initialChannel: ChatChannel?,
              onDismiss: () -> Unit,
              onEditPhoto: (Bitmap, (Bitmap) -> Unit) -> Unit,
              onConfirm: (ChatChannel) -> Unit
          ) {
              val context = LocalContext.current
              var title by remember { mutableStateOf(initialChannel?.title ?: "") }
              var username by remember { mutableStateOf(initialChannel?.username ?: "") }
              var description by remember { mutableStateOf(initialChannel?.description ?: "") }
              var isChannel by remember { mutableStateOf(initialChannel?.isChannel ?: true) }
              var avatarBmp by remember { mutableStateOf<Bitmap?>(initialChannel?.avatarBitmap) }

              val photoPickerLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.GetContent()
              ) { uri: Uri? ->
                  if (uri != null) {
                      val loaded = loadBitmapFromUri(context, uri)
                      if (loaded != null) {
                          onEditPhoto(loaded) { edited ->
                              avatarBmp = edited
                          }
                      }
                  }
              }

              AlertDialog(
                  onDismissRequest = onDismiss,
                  containerColor = theme.card,
                  title = {
                      Text(
                          text = if (initialChannel == null) "Новый канал или чат" else "Настройки канала",
                          color = theme.textMain,
                          fontWeight = FontWeight.Bold
                      )
                  },
                  text = {
                      Column(
                          horizontalAlignment = Alignment.CenterHorizontally,
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Box(
                              contentAlignment = Alignment.Center,
                              modifier = Modifier
                                  .size(88.dp)
                                  .clickable { photoPickerLauncher.launch("image/*") }
                          ) {
                              AvatarView(
                                  title = if (title.isBlank()) "К" else title,
                                  bitmap = avatarBmp,
                                  size = 84,
                                  theme = theme
                              )
                              Surface(
                                  color = theme.accent,
                                  shape = CircleShape,
                                  modifier = Modifier
                                      .size(28.dp)
                                      .align(Alignment.BottomEnd)
                              ) {
                                  Box(contentAlignment = Alignment.Center) {
                                      Icon(
                                          Icons.Default.CameraAlt,
                                          contentDescription = null,
                                          tint = Color.White,
                                          modifier = Modifier.size(16.dp)
                                      )
                                  }
                              }
                          }

                          if (avatarBmp != null) {
                              TextButton(
                                  onClick = {
                                      onEditPhoto(avatarBmp!!) { reEdited ->
                                          avatarBmp = reEdited
                                      }
                                  }
                              ) {
                                  Icon(Icons.Default.Tune, contentDescription = null, tint = theme.accent, modifier = Modifier.size(16.dp))
                                  Spacer(Modifier.width(4.dp))
                                  Text("Редактировать фото", color = theme.accent, fontSize = 13.sp)
                              }
                          } else {
                              Text(
                                  text = "Нажмите на аватарку, чтобы выбрать и отредактировать фото",
                                  color = theme.textSub,
                                  fontSize = 12.sp,
                                  textAlign = TextAlign.Center,
                                  modifier = Modifier.padding(top = 6.dp, bottom = 10.dp)
                              )
                          }

                          OutlinedTextField(
                              value = title,
                              onValueChange = { title = it },
                              label = { Text("Название канала / чата") },
                              singleLine = true,
                              modifier = Modifier.fillMaxWidth()
                          )
                          Spacer(Modifier.height(10.dp))
                          OutlinedTextField(
                              value = username,
                              onValueChange = { username = it.filter { c -> c.isLetterOrDigit() || c == '_' }.lowercase() },
                              label = { Text("@юзернейм (например, releases)") },
                              singleLine = true,
                              modifier = Modifier.fillMaxWidth()
                          )
                          Spacer(Modifier.height(10.dp))
                          OutlinedTextField(
                              value = description,
                              onValueChange = { description = it },
                              label = { Text("Описание") },
                              singleLine = true,
                              modifier = Modifier.fillMaxWidth()
                          )

                          if (initialChannel == null) {
                              Spacer(Modifier.height(8.dp))
                              Row(
                                  verticalAlignment = Alignment.CenterVertically,
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Checkbox(checked = isChannel, onCheckedChange = { isChannel = it })
                                  Text("Формат канала", color = theme.textMain, fontSize = 14.sp)
                              }
                          }
                      }
                  },
                  confirmButton = {
                      Button(
                          onClick = {
                              if (title.isNotBlank()) {
                                  val cleanUser = if (username.isBlank()) "channel_${System.currentTimeMillis() % 1000}" else username
                                  if (initialChannel != null) {
                                      onConfirm(
                                          initialChannel.copy(
                                              title = title.trim(),
                                              username = cleanUser,
                                              description = description.trim(),
                                              avatarBitmap = avatarBmp
                                          )
                                      )
                                  } else {
                                      onConfirm(
                                          ChatChannel(
                                              id = "ch_${System.currentTimeMillis()}",
                                              title = title.trim(),
                                              username = cleanUser,
                                              description = description.trim(),
                                              isChannel = isChannel,
                                              avatarBitmap = avatarBmp
                                          )
                                      )
                                  }
                              }
                          },
                          colors = ButtonDefaults.buttonColors(containerColor = theme.accent)
                      ) {
                          Text("Сохранить", color = Color.White)
                      }
                  },
                  dismissButton = {
                      TextButton(onClick = onDismiss) {
                          Text("Отмена", color = theme.textSub)
                      }
                  }
              )
          }

          @Composable
          fun ChatConversationScreen(
              chat: ChatChannel,
              theme: AppThemeMode,
              onBack: () -> Unit,
              onEditChannel: () -> Unit,
              onEditPhotoRequest: (Bitmap, (Bitmap) -> Unit) -> Unit
          ) {
              val context = LocalContext.current
              var text by remember { mutableStateOf("") }

              BackHandler(onBack = onBack)

              val attachImageLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.GetContent()
              ) { uri: Uri? ->
                  if (uri != null) {
                      val bmp = loadBitmapFromUri(context, uri)
                      if (bmp != null) {
                          onEditPhotoRequest(bmp) { editedBmp ->
                              val now = SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date())
                              chat.messages.add(
                                  MessageItem(
                                      id = System.currentTimeMillis(),
                                      author = "Вы",
                                      text = if (text.isBlank()) "Фотография" else text.trim(),
                                      time = now,
                                      isMine = true,
                                      imageBitmap = editedBmp
                                  )
                              )
                              text = ""
                          }
                      }
                  }
              }

              Column(modifier = Modifier.fillMaxSize().background(theme.bg)) {
                  Surface(
                      color = theme.card,
                      border = BorderStroke(1.dp, theme.stroke),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Row(
                          verticalAlignment = Alignment.CenterVertically,
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(horizontal = 12.dp, vertical = 10.dp)
                      ) {
                          IconButton(onClick = onBack) {
                              Icon(Icons.AutoMirrored.Filled.ArrowBack, contentDescription = "Назад", tint = theme.textMain)
                          }
                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              modifier = Modifier
                                  .weight(1f)
                                  .clickable(onClick = onEditChannel)
                          ) {
                              AvatarView(
                                  title = chat.title,
                                  bitmap = chat.avatarBitmap,
                                  size = 42,
                                  theme = theme
                              )
                              Spacer(Modifier.width(12.dp))
                              Column {
                                  Text(
                                      text = chat.title,
                                      color = theme.textMain,
                                      fontSize = 16.sp,
                                      fontWeight = FontWeight.Bold
                                  )
                                  Text(
                                      text = "@${chat.username}",
                                      color = theme.textSub,
                                      fontSize = 13.sp
                                  )
                              }
                          }
                          IconButton(onClick = onEditChannel) {
                              Icon(Icons.Default.Edit, contentDescription = "Изменить канал", tint = theme.accent)
                          }
                      }
                  }

                  LazyColumn(
                      contentPadding = PaddingValues(16.dp),
                      verticalArrangement = Arrangement.spacedBy(10.dp),
                      modifier = Modifier.weight(1f)
                  ) {
                      item {
                          Box(modifier = Modifier.fillMaxWidth(), contentAlignment = Alignment.Center) {
                              Surface(
                                  color = theme.card,
                                  shape = RoundedCornerShape(50),
                                  border = BorderStroke(1.dp, theme.stroke)
                              ) {
                                  Text(
                                      text = "Сегодня",
                                      color = theme.textSub,
                                      fontSize = 12.sp,
                                      modifier = Modifier.padding(horizontal = 14.dp, vertical = 5.dp)
                                  )
                              }
                          }
                      }

                      items(chat.messages, key = { it.id }) { msg ->
                          Column(
                              horizontalAlignment = if (msg.isMine) Alignment.End else Alignment.Start,
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              Surface(
                                  color = if (msg.isMine) theme.myBubble else theme.theirBubble,
                                  shape = RoundedCornerShape(
                                      topStart = 18.dp,
                                      topEnd = 18.dp,
                                      bottomStart = if (msg.isMine) 18.dp else 4.dp,
                                      bottomEnd = if (msg.isMine) 4.dp else 18.dp
                                  ),
                                  modifier = Modifier.widthIn(max = 290.dp)
                              ) {
                                  Column(modifier = Modifier.padding(12.dp)) {
                                      if (msg.imageBitmap != null) {
                                          Image(
                                              bitmap = msg.imageBitmap.asImageBitmap(),
                                              contentDescription = null,
                                              contentScale = ContentScale.Crop,
                                              modifier = Modifier
                                                  .fillMaxWidth()
                                                  .height(190.dp)
                                                  .clip(RoundedCornerShape(12.dp))
                                                  .clickable {
                                                      onEditPhotoRequest(msg.imageBitmap) { updatedBmp ->
                                                          val i = chat.messages.indexOfFirst { it.id == msg.id }
                                                          if (i != -1) {
                                                              chat.messages[i] = msg.copy(imageBitmap = updatedBmp)
                                                          }
                                                      }
                                                  }
                                          )
                                          Spacer(Modifier.height(6.dp))
                                      }
                                      Text(
                                          text = msg.text,
                                          color = if (msg.isMine) Color.White else theme.textMain,
                                          fontSize = 15.sp
                                      )
                                      Spacer(Modifier.height(2.dp))
                                      Text(
                                          text = msg.time,
                                          color = if (msg.isMine) Color.White.copy(alpha = 0.75f) else theme.textSub,
                                          fontSize = 11.sp,
                                          modifier = Modifier.align(Alignment.End)
                                      )
                                  }
                              }
                          }
                      }
                  }

                  Surface(
                      color = theme.card,
                      border = BorderStroke(1.dp, theme.stroke),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Row(
                          verticalAlignment = Alignment.CenterVertically,
                          modifier = Modifier.padding(horizontal = 12.dp, vertical = 8.dp)
                      ) {
                          IconButton(onClick = { attachImageLauncher.launch("image/*") }) {
                              Icon(Icons.Default.Image, contentDescription = "Прикрепить фото", tint = theme.accent)
                          }
                          TextField(
                              value = text,
                              onValueChange = { text = it },
                              placeholder = { Text("Сообщение", color = theme.textSub) },
                              singleLine = true,
                              colors = TextFieldDefaults.colors(
                                  focusedTextColor = theme.textMain,
                                  unfocusedTextColor = theme.textMain,
                                  focusedContainerColor = Color.Transparent,
                                  unfocusedContainerColor = Color.Transparent,
                                  focusedIndicatorColor = Color.Transparent,
                                  unfocusedIndicatorColor = Color.Transparent
                              ),
                              modifier = Modifier.weight(1f)
                          )
                          Surface(
                              color = theme.accent,
                              shape = CircleShape,
                              modifier = Modifier
                                  .size(44.dp)
                                  .clickable {
                                      if (text.isNotBlank()) {
                                          val now = SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date())
                                          chat.messages.add(
                                              MessageItem(
                                                  id = System.currentTimeMillis(),
                                                  author = "Вы",
                                                  text = text.trim(),
                                                  time = now,
                                                  isMine = true
                                              )
                                          )
                                          text = ""
                                      }
                                  }
                          ) {
                              Box(contentAlignment = Alignment.Center) {
                                  Icon(Icons.AutoMirrored.Filled.Send, contentDescription = "Отправить", tint = Color.White, modifier = Modifier.size(20.dp))
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun FullPhotoEditorScreen(
              initialBitmap: Bitmap,
              theme: AppThemeMode,
              onCancel: () -> Unit,
              onSave: (Bitmap) -> Unit
          ) {
              var rotation by remember { mutableFloatStateOf(0f) }
              var scaleCrop by remember { mutableFloatStateOf(1f) }
              var brightness by remember { mutableFloatStateOf(0f) }
              var contrast by remember { mutableFloatStateOf(1f) }
              var filterIndex by remember { mutableIntStateOf(0) }
              var drawMode by remember { mutableStateOf(false) }
              val strokes = remember { mutableStateListOf<List<Offset>>() }
              var currentStroke by remember { mutableStateOf<List<Offset>>(emptyList()) }

              val filterNames = listOf("Оригинал", "Закат", "Холод", "Ч/Б", "Контраст")

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color.Black)
                      .padding(16.dp)
              ) {
                  Row(
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.SpaceBetween,
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      TextButton(onClick = onCancel) {
                          Text("Отмена", color = Color.White, fontSize = 16.sp)
                      }
                      Text("Редактор фото", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 18.sp)
                      Button(
                          onClick = {
                              val finalBmp = renderEditedBitmap(
                                  source = initialBitmap,
                                  rotation = rotation,
                                  scaleCrop = scaleCrop,
                                  brightness = brightness,
                                  contrast = contrast,
                                  filterIndex = filterIndex,
                                  strokes = strokes
                              )
                              onSave(finalBmp)
                          },
                          colors = ButtonDefaults.buttonColors(containerColor = theme.accent),
                          shape = RoundedCornerShape(12.dp)
                      ) {
                          Text("Готово", color = Color.White, fontWeight = FontWeight.Bold)
                      }
                  }

                  Box(
                      contentAlignment = Alignment.Center,
                      modifier = Modifier
                          .weight(1f)
                          .fillMaxWidth()
                          .padding(vertical = 12.dp)
                          .clip(RoundedCornerShape(18.dp))
                          .background(Color(0xFF101218))
                  ) {
                      val previewBmp = remember(initialBitmap, rotation, scaleCrop, brightness, contrast, filterIndex) {
                          renderEditedBitmap(
                              source = initialBitmap,
                              rotation = rotation,
                              scaleCrop = scaleCrop,
                              brightness = brightness,
                              contrast = contrast,
                              filterIndex = filterIndex,
                              strokes = emptyList()
                          )
                      }

                      Image(
                          bitmap = previewBmp.asImageBitmap(),
                          contentDescription = null,
                          contentScale = ContentScale.Fit,
                          modifier = Modifier.fillMaxSize()
                      )

                      Canvas(
                          modifier = Modifier
                              .fillMaxSize()
                              .pointerInput(drawMode) {
                                  if (!drawMode) return@pointerInput
                                  detectDragGestures(
                                      onDragStart = { offset ->
                                          currentStroke = listOf(offset)
                                      },
                                      onDrag = { change, _ ->
                                          change.consume()
                                          currentStroke = currentStroke + change.position
                                      },
                                      onDragEnd = {
                                          if (currentStroke.size > 1) {
                                              strokes.add(currentStroke)
                                          }
                                          currentStroke = emptyList()
                                      }
                                  )
                              }
                      ) {
                          (strokes + listOf(currentStroke)).forEach { pts ->
                              if (pts.size > 1) {
                                  val path = Path().apply {
                                      moveTo(pts.first().x, pts.first().y)
                                      pts.drop(1).forEach { lineTo(it.x, it.y) }
                                  }
                                  drawPath(
                                      path = path,
                                      color = Color(0xFF637BFF),
                                      style = Stroke(width = 8f, cap = StrokeCap.Round)
                                  )
                              }
                          }
                      }
                  }

                  LazyRow(
                      horizontalArrangement = Arrangement.spacedBy(8.dp),
                      modifier = Modifier.padding(bottom = 10.dp)
                  ) {
                      items(filterNames.size) { idx ->
                          val active = filterIndex == idx
                          Surface(
                              color = if (active) theme.accent else Color(0xFF1C202B),
                              shape = RoundedCornerShape(12.dp),
                              modifier = Modifier.clickable { filterIndex = idx }
                          ) {
                              Text(
                                  text = filterNames[idx],
                                  color = Color.White,
                                  fontSize = 13.sp,
                                  fontWeight = FontWeight.Medium,
                                  modifier = Modifier.padding(horizontal = 14.dp, vertical = 8.dp)
                              )
                          }
                      }
                  }

                  Text("Яркость", color = Color.Gray, fontSize = 12.sp)
                  Slider(
                      value = brightness,
                      onValueChange = { brightness = it },
                      valueRange = -80f..80f
                  )

                  Text("Масштаб / Обрезка", color = Color.Gray, fontSize = 12.sp)
                  Slider(
                      value = scaleCrop,
                      onValueChange = { scaleCrop = it },
                      valueRange = 1f..2.2f
                  )

                  Row(
                      horizontalArrangement = Arrangement.SpaceEvenly,
                      modifier = Modifier.fillMaxWidth().padding(top = 4.dp)
                  ) {
                      IconButton(onClick = { rotation = (rotation + 90f) % 360f }) {
                          Icon(Icons.Default.RotateRight, contentDescription = "Повернуть", tint = Color.White)
                      }
                      IconButton(onClick = { contrast = if (contrast > 1.3f) 1f else 1.45f }) {
                          Icon(Icons.Default.Contrast, contentDescription = "Контраст", tint = Color.White)
                      }
                      IconButton(onClick = { drawMode = !drawMode }) {
                          Icon(
                              Icons.Default.Brush,
                              contentDescription = "Кисть",
                              tint = if (drawMode) theme.accent else Color.White
                          )
                      }
                      IconButton(
                          onClick = {
                              rotation = 0f
                              scaleCrop = 1f
                              brightness = 0f
                              contrast = 1f
                              filterIndex = 0
                              strokes.clear()
                          }
                      ) {
                          Icon(Icons.Default.Refresh, contentDescription = "Сброс", tint = Color.White)
                      }
                  }
              }
          }

          fun renderEditedBitmap(
              source: Bitmap,
              rotation: Float,
              scaleCrop: Float,
              brightness: Float,
              contrast: Float,
              filterIndex: Int,
              strokes: List<List<Offset>>
          ): Bitmap {
              val matrix = Matrix().apply {
                  postRotate(rotation)
                  postScale(scaleCrop, scaleCrop)
              }
              val transformed = runCatching {
                  Bitmap.createBitmap(source, 0, 0, source.width, source.height, matrix, true)
              }.getOrDefault(source)

              val out = Bitmap.createBitmap(transformed.width, transformed.height, Bitmap.Config.ARGB_8888)
              val canvas = AndroidCanvas(out)
              val paint = AndroidPaint(AndroidPaint.ANTI_ALIAS_FLAG)

              val cm = ColorMatrix()
              val b = brightness
              val c = contrast
              val t = 128f * (1f - c) + b

              when (filterIndex) {
                  3 -> cm.setSaturation(0f)
                  1 -> cm.setScale(1.12f, 1.02f, 0.88f, 1f)
                  2 -> cm.setScale(0.88f, 1.02f, 1.15f, 1f)
                  4 -> cm.setScale(1.2f, 1.2f, 1.2f, 1f)
              }

              val bcMatrix = ColorMatrix(
                  floatArrayOf(
                      c, 0f, 0f, 0f, t,
                      0f, c, 0f, 0f, t,
                      0f, 0f, c, 0f, t,
                      0f, 0f, 0f, 1f, 0f
                  )
              )
              cm.postConcat(bcMatrix)
              paint.colorFilter = ColorMatrixColorFilter(cm)
              canvas.drawBitmap(transformed, 0f, 0f, paint)

              if (strokes.isNotEmpty()) {
                  val strokePaint = AndroidPaint(AndroidPaint.ANTI_ALIAS_FLAG).apply {
                      color = android.graphics.Color.parseColor("#637BFF")
                      style = AndroidPaint.Style.STROKE
                      strokeWidth = 10f
                  }
                  strokes.forEach { pts ->
                      for (i in 0 until pts.size - 1) {
                          canvas.drawLine(pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y, strokePaint)
                      }
                  }
              }
              return out
          }

          fun loadBitmapFromUri(context: Context, uri: Uri): Bitmap? {
              return runCatching {
                  context.contentResolver.openInputStream(uri)?.use { stream ->
                      BitmapFactory.decodeStream(stream)
                  }
              }.getOrNull()
          }

          @Composable
          fun AvatarView(
              title: String,
              bitmap: Bitmap?,
              size: Int,
              theme: AppThemeMode
          ) {
              if (bitmap != null) {
                  Image(
                      bitmap = bitmap.asImageBitmap(),
                      contentDescription = null,
                      contentScale = ContentScale.Crop,
                      modifier = Modifier
                          .size(size.dp)
                          .clip(CircleShape)
                  )
              } else {
                  val initials = title.trim().split(" ")
                      .filter { it.isNotEmpty() }
                      .take(2)
                      .joinToString("") { it.take(1).uppercase() }
                      .ifEmpty { "M" }

                  Box(
                      contentAlignment = Alignment.Center,
                      modifier = Modifier
                          .size(size.dp)
                          .clip(CircleShape)
                          .background(
                              Brush.linearGradient(
                                  listOf(theme.accent, theme.accentSecond)
                              )
                          )
                  ) {
                      Text(
                          text = initials,
                          color = Color.White,
                          fontSize = (size * 0.36f).sp,
                          fontWeight = FontWeight.Bold
                      )
                  }
              }
          }

          @Composable
          fun BottomBarFromMockup(
              currentTab: Int,
              theme: AppThemeMode,
              onSelectTab: (Int) -> Unit
          ) {
              val tabs = listOf(
                  Triple(0, Icons.Default.ChatBubbleOutline, "Чаты"),
                  Triple(1, Icons.Default.Search, "Поиск"),
                  Triple(2, Icons.Default.Settings, "Настройки")
              )

              Surface(
                  color = theme.card,
                  border = BorderStroke(1.dp, theme.stroke),
                  modifier = Modifier.fillMaxWidth()
              ) {
                  Row(
                      horizontalArrangement = Arrangement.SpaceEvenly,
                      verticalAlignment = Alignment.CenterVertically,
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(vertical = 8.dp)
                  ) {
                      tabs.forEach { (idx, icon, label) ->
                          val selected = currentTab == idx
                          Column(
                              horizontalAlignment = Alignment.CenterHorizontally,
                              modifier = Modifier
                                  .clip(RoundedCornerShape(12.dp))
                                  .clickable { onSelectTab(idx) }
                                  .padding(horizontal = 24.dp, vertical = 4.dp)
                          ) {
                              Icon(
                                  imageVector = icon,
                                  contentDescription = label,
                                  tint = if (selected) theme.accent else theme.textSub,
                                  modifier = Modifier.size(22.dp)
                              )
                              Spacer(Modifier.height(2.dp))
                              Text(
                                  text = label,
                                  color = if (selected) theme.accent else theme.textSub,
                                  fontSize = 12.sp,
                                  fontWeight = if (selected) FontWeight.Bold else FontWeight.Normal
                              )
                          }
                      }
                  }
              }
          }
          EOF

      - name: Create Full Project ZIP Archive
        run: |
          zip -r Messenger-Full-Project.zip settings.gradle.kts build.gradle.kts gradle.properties app .github

      - name: Upload Project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Messenger-Full-Project-ZIP
          path: Messenger-Full-Project.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Compiled Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Messenger-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
