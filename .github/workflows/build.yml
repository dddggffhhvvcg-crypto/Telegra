name: Generate Full Project ZIP & Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Complete Messenger Project Structure
        run: |
          mkdir -p app/src/main/java/com/mychat/app
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Messenger"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.mychat.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.mychat.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0-Expressive"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.09.02")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.6")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.graphics:graphics-shapes:1.0.1")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@android:drawable/sym_action_chat"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Messenger</string>
              <string name="welcome_slogan">Expressive-мессенджер нового поколения</string>
              <string name="create_account">Создать аккаунт</string>
              <string name="sign_in">Войти</string>
              <string name="search_settings">Найти настройки</string>
              <string name="event_title">Ивент</string>
              <string name="event_sub">Halloween</string>
              <string name="gift_badge">Подарок</string>
              <string name="pull_to_open">Потяните, чтобы открыть</string>
              <string name="tap_prompt">Нажми</string>
              <string name="choose_one">Выберите одну</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/java/com/mychat/app/MainActivity.kt
          package com.mychat.app

          import android.content.Context
          import android.os.Bundle
          import android.os.HapticFeedbackConstants
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.setContent
          import androidx.compose.animation.*
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.*
          import androidx.compose.foundation.gestures.Orientation
          import androidx.compose.foundation.gestures.draggable
          import androidx.compose.foundation.gestures.rememberDraggableState
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.lazy.rememberLazyListState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.automirrored.filled.ArrowBack
          import androidx.compose.material.icons.automirrored.filled.ArrowForward
          import androidx.compose.material.icons.automirrored.filled.Send
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.alpha
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.rotate
          import androidx.compose.ui.draw.scale
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.graphics.drawscope.Fill
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.layout.onSizeChanged
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.platform.LocalView
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.text.input.VisualTransformation
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.Dp
          import androidx.compose.ui.unit.IntOffset
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlin.math.cos
          import kotlin.math.roundToInt
          import kotlin.math.sin

          // Цветовая палитра из референса
          val BgDark = Color(0xFF0E0F11)
          val CardDark = Color(0xFF181B1C)
          val CardStroke = Color(0xFF23282A)
          val AccentTeal = Color(0xFF81A9AB)
          val ContainerTeal = Color(0xFF23393B)
          val ContainerPurple = Color(0xFF2E2C3B)
          val ToastLight = Color(0xFFDDDDDF)
          val TextWhite = Color(0xFFF2F5F5)
          val TextSub = Color(0xFF8A9496)

          enum class ShapeType { COOKIE, SUNNY, PENTAGON, CLOVER, HEXAGON }

          data class AccountProfile(
              val name: String,
              val username: String,
              val email: String,
              val bio: String = "Разработчик и дизайнер",
              val frameReward: String = ""
          )

          data class ChatMessage(
              val id: Long,
              val sender: String,
              val text: String,
              val time: String,
              val isMine: Boolean,
              val reactions: List<String> = emptyList(),
              val replyTo: String? = null
          )

          data class ChatDialog(
              val id: String,
              val title: String,
              val username: String,
              val folder: String, // Личные, Группы, Каналы
              val isChannel: Boolean = false,
              val subscribers: Int = 1,
              val unread: Int = 0,
              val muted: Boolean = false,
              val pinned: Boolean = false,
              val shape: ShapeType = ShapeType.COOKIE,
              val messages: MutableList<ChatMessage>
          )

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(
                          colorScheme = darkColorScheme(
                              background = BgDark,
                              surface = CardDark,
                              primary = AccentTeal,
                              secondaryContainer = ContainerTeal,
                              onBackground = TextWhite,
                              onSurface = TextWhite
                          )
                      ) {
                          MessengerRoot()
                      }
                  }
              }
          }

          @Composable
          fun MessengerRoot() {
              val context = LocalContext.current
              val prefs = remember { context.getSharedPreferences("expressive_messenger", Context.MODE_PRIVATE) }
              val view = LocalView.current
              val scope = rememberCoroutineScope()

              // Мультиаккаунт и сессия
              val accounts = remember {
                  mutableStateListOf<AccountProfile>().apply {
                      val savedUser = prefs.getString("username", "") ?: ""
                      if (savedUser.isNotEmpty()) {
                          add(
                              AccountProfile(
                                  name = prefs.getString("name", "Makslim Zevlachkov") ?: "Makslim Zevlachkov",
                                  username = savedUser,
                                  email = prefs.getString("email", "user@mail.ru") ?: "user@mail.ru",
                                  frameReward = prefs.getString("reward", "") ?: ""
                              )
                          )
                          add(AccountProfile("Второй аккаунт", "dev_second", "second@mail.ru"))
                      }
                  }
              }
              var activeAccountIndex by remember { mutableIntStateOf(0) }

              // Навигация верхнего уровня
              var screenState by remember {
                  mutableStateOf(if (accounts.isEmpty()) "AUTH" else "MAIN")
              }
              var activeTab by remember { mutableIntStateOf(3) } // 0:Чаты, 1:Контакты, 2:Профиль, 3:Настройки
              var openedChatId by remember { mutableStateOf<String?>(null) }
              var subScreen by remember { mutableStateOf<String?>(null) } // SEARCH, EVENT, THEMES, CUSTOMIZE, CREATE_CHAT

              // Светлый тост как на видео (00:20)
              var lightToastText by remember { mutableStateOf<String?>(null) }
              fun showExpressiveToast(msg: String) {
                  view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                  lightToastText = msg
                  scope.launch {
                      delay(3200)
                      if (lightToastText == msg) lightToastText = null
                  }
              }

              // Начальные чаты, группы, каналы и Избранное
              val dialogs = remember {
                  mutableStateListOf(
                      ChatDialog(
                          id = "saved",
                          title = "Избранное",
                          username = "saved_messages",
                          folder = "Личные",
                          pinned = true,
                          shape = ShapeType.CLOVER,
                          messages = mutableStateListOf(
                              ChatMessage(1, "Вы", "Заметки, пароли и сохранённые файлы", "10:15", true, listOf("🎃"))
                          )
                      ),
                      ChatDialog(
                          id = "design_chan",
                          title = "Expressive Design News",
                          username = "expressive_ui",
                          folder = "Каналы",
                          isChannel = true,
                          subscribers = 14820,
                          unread = 2,
                          pinned = true,
                          shape = ShapeType.SUNNY,
                          messages = mutableStateListOf(
                              ChatMessage(2, "Expressive Design News", "Вышло обновление с поддержкой Halloween-ивента и новых морф-форм!", "09:40", false, listOf("🎃", "👻", "🕸️"))
                          )
                      ),
                      ChatDialog(
                          id = "alex",
                          title = "Алексей Морозов",
                          username = "alex_frost",
                          folder = "Личные",
                          unread = 1,
                          shape = ShapeType.COOKIE,
                          messages = mutableStateListOf(
                              ChatMessage(3, "Алексей", "Привет! Ты уже открыл подарок в настройках?", "09:50", false),
                              ChatMessage(4, "Вы", "Сейчас зайду проверю!", "09:51", true)
                          )
                      ),
                      ChatDialog(
                          id = "android_grp",
                          title = "Android Kotlin Чат",
                          username = "kotlin_devs",
                          folder = "Группы",
                          subscribers = 412,
                          muted = true,
                          shape = ShapeType.HEXAGON,
                          messages = mutableStateListOf(
                              ChatMessage(5, "Дмитрий", "Сборка через GitHub Actions прошла за 2 минуты!", "Вчера", false, listOf("🔥"))
                          )
                      )
                  )
              }

              Box(modifier = Modifier.fillMaxSize().background(BgDark)) {
                  when (screenState) {
                      "AUTH" -> AuthFlowScreen(
                          onComplete = { newProfile ->
                              prefs.edit()
                                  .putString("name", newProfile.name)
                                  .putString("username", newProfile.username)
                                  .putString("email", newProfile.email)
                                  .apply()
                              accounts.add(0, newProfile)
                              activeAccountIndex = 0
                              screenState = "MAIN"
                              activeTab = 0
                              showExpressiveToast("Добро пожаловать, @${newProfile.username}!")
                          }
                      )

                      "MAIN" -> {
                          val currentAccount = accounts.getOrElse(activeAccountIndex) {
                              AccountProfile("Makslim Zevlachkov", "slim", "slim@mail.ru")
                          }

                          // Внутренние экраны поверх вкладок
                          when {
                              openedChatId != null -> {
                                  val chat = dialogs.find { it.id == openedChatId }
                                  if (chat != null) {
                                      ChatDetailScreen(
                                          chat = chat,
                                          onBack = { openedChatId = null },
                                          onToast = ::showExpressiveToast
                                      )
                                  } else {
                                      openedChatId = null
                                  }
                              }

                              subScreen == "EVENT" -> {
                                  HalloweenEventScreen(
                                      onBack = { subScreen = null },
                                      onRewardSelected = { rewardName ->
                                          prefs.edit().putString("reward", rewardName).apply()
                                          accounts[activeAccountIndex] = currentAccount.copy(frameReward = rewardName)
                                          subScreen = null
                                          showExpressiveToast("Вам выпало:\n$rewardName")
                                      }
                                  )
                              }

                              subScreen == "SEARCH" -> {
                                  GlobalSearchScreen(
                                      dialogs = dialogs,
                                      onBack = { subScreen = null },
                                      onOpenChat = { id ->
                                          subScreen = null
                                          openedChatId = id
                                      }
                                  )
                              }

                              subScreen == "CREATE_CHAT" -> {
                                  CreateGroupOrChannelScreen(
                                      onBack = { subScreen = null },
                                      onCreate = { newDialog ->
                                          dialogs.add(0, newDialog)
                                          subScreen = null
                                          openedChatId = newDialog.id
                                          showExpressiveToast("Создано: ${newDialog.title}")
                                      }
                                  )
                              }

                              else -> {
                                  val listState = rememberLazyListState()
                                  val isScrollingDown by remember {
                                      derivedStateOf { listState.firstVisibleItemScrollOffset > 60 }
                                  }

                                  Box(modifier = Modifier.fillMaxSize()) {
                                      when (activeTab) {
                                          0 -> ChatsTabScreen(
                                              dialogs = dialogs,
                                              listState = listState,
                                              onOpenChat = { openedChatId = it },
                                              onNewChat = { subScreen = "CREATE_CHAT" },
                                              onOpenSearch = { subScreen = "SEARCH" },
                                              onToast = ::showExpressiveToast
                                          )
                                          1 -> ContactsTabScreen(
                                              dialogs = dialogs,
                                              onOpenChat = { openedChatId = it },
                                              onOpenSearch = { subScreen = "SEARCH" },
                                              onToast = ::showExpressiveToast
                                          )
                                          2 -> ProfileTabScreen(
                                              account = currentAccount,
                                              onUpdate = { updated ->
                                                  accounts[activeAccountIndex] = updated
                                                  showExpressiveToast("Профиль обновлён")
                                              },
                                              onToast = ::showExpressiveToast
                                          )
                                          3 -> SettingsReferenceScreen(
                                              account = currentAccount,
                                              accounts = accounts,
                                              listState = listState,
                                              onSelectAccount = { idx ->
                                                  activeAccountIndex = idx
                                                  showExpressiveToast("Аккаунт @${accounts[idx].username}")
                                              },
                                              onAddAccount = { screenState = "AUTH" },
                                              onOpenEvent = { subScreen = "EVENT" },
                                              onOpenSaved = { openedChatId = "saved" },
                                              onLogout = {
                                                  prefs.edit().clear().apply()
                                                  accounts.clear()
                                                  screenState = "AUTH"
                                              },
                                              onToast = ::showExpressiveToast
                                          )
                                      }

                                      // Парящая нижняя навигация («пилюля» + отдельная кнопка поиска справа)
                                      ExpressiveFloatingBottomBar(
                                          activeTab = activeTab,
                                          compactMode = isScrollingDown,
                                          onSelectTab = {
                                              view.performHapticFeedback(HapticFeedbackConstants.CLOCK_TICK)
                                              activeTab = it
                                          },
                                          onSearchClick = {
                                              view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                                              subScreen = "SEARCH"
                                          },
                                          modifier = Modifier
                                              .align(Alignment.BottomCenter)
                                              .padding(bottom = 18.dp, start = 16.dp, end = 16.dp)
                                      )
                                  }
                              }
                          }
                      }
                  }

                  // Светлый тост внизу экрана (точно как на 00:20 в видео)
                  AnimatedVisibility(
                      visible = lightToastText != null,
                      enter = fadeIn() + slideInVertically { it / 2 },
                      exit = fadeOut() + slideOutVertically { it / 2 },
                      modifier = Modifier
                          .align(Alignment.BottomCenter)
                          .padding(bottom = 86.dp, start = 28.dp, end = 28.dp)
                  ) {
                      Surface(
                          color = ToastLight,
                          shape = RoundedCornerShape(18.dp),
                          shadowElevation = 8.dp
                      ) {
                          Text(
                              text = lightToastText ?: "",
                              color = Color(0xFF141618),
                              fontSize = 15.sp,
                              fontWeight = FontWeight.Medium,
                              modifier = Modifier.padding(horizontal = 22.dp, vertical = 14.dp)
                          )
                      }
                  }
              }
          }

          // ============================================================================
          // МОРФЯЩИЕСЯ ФОРМЫ В СТИЛЕ MATERIAL SHAPES (COOKIE, SUNNY, CLOVER, PENTAGON)
          // ============================================================================
          @Composable
          fun ExpressiveMorphIcon(
              shapeType: ShapeType,
              containerColor: Color,
              modifier: Modifier = Modifier.size(42.dp),
              lobeCountOverride: Int? = null,
              content: @Composable BoxScope.() -> Unit
          ) {
              val infinite = rememberInfiniteTransition(label = "morph")
              val phase by infinite.animateFloat(
                  initialValue = 0f,
                  targetValue = 6.28318f,
                  animationSpec = infiniteRepeatable(tween(9000, easing = LinearEasing)),
                  label = "phase"
              )

              Box(modifier = modifier, contentAlignment = Alignment.Center) {
                  Canvas(modifier = Modifier.fillMaxSize()) {
                      val cx = size.width / 2f
                      val cy = size.height / 2f
                      val baseR = size.minDimension * 0.43f
                      val lobes = lobeCountOverride ?: when (shapeType) {
                          ShapeType.COOKIE -> 8
                          ShapeType.SUNNY -> 12
                          ShapeType.PENTAGON -> 5
                          ShapeType.CLOVER -> 4
                          ShapeType.HEXAGON -> 6
                      }
                      val amp = when (shapeType) {
                          ShapeType.SUNNY -> baseR * 0.13f
                          ShapeType.CLOVER -> baseR * 0.16f
                          else -> baseR * 0.09f
                      }

                      val path = Path()
                      val steps = 140
                      for (i in 0..steps) {
                          val angle = 2.0 * Math.PI * i / steps
                          val r = baseR + sin(angle * lobes + phase * 0.3f).toFloat() * amp
                          val x = cx + (r * cos(angle)).toFloat()
                          val y = cy + (r * sin(angle)).toFloat()
                          if (i == 0) path.moveTo(x, y) else path.lineTo(x, y)
                      }
                      path.close()
                      drawPath(path, color = containerColor, style = Fill)
                  }
                  content()
              }
          }

          // ============================================================================
          // СЕГМЕНТИРОВАННЫЕ КАРТОЧКИ (ГРУППИРОВКА С РАЗНЫМ СКРУГЛЕНИЕМ ВЕРХ/СЕРЕДИНА/НИЗ)
          // ============================================================================
          fun segmentedShape(index: Int, total: Int): RoundedCornerShape {
              val outer = 24.dp
              val inner = 6.dp
              return when {
                  total <= 1 -> RoundedCornerShape(outer)
                  index == 0 -> RoundedCornerShape(topStart = outer, topEnd = outer, bottomStart = inner, bottomEnd = inner)
                  index == total - 1 -> RoundedCornerShape(topStart = inner, topEnd = inner, bottomStart = outer, bottomEnd = outer)
                  else -> RoundedCornerShape(inner)
              }
          }

          @Composable
          fun SectionHeader(title: String) {
              Text(
                  text = title,
                  color = AccentTeal,
                  fontSize = 14.sp,
                  fontWeight = FontWeight.SemiBold,
                  modifier = Modifier.padding(start = 16.dp, top = 18.dp, bottom = 8.dp)
              )
          }

          @Composable
          fun SegmentedSettingCard(
              index: Int,
              total: Int,
              icon: ImageVector,
              title: String,
              subtitle: String? = null,
              shapeType: ShapeType = ShapeType.COOKIE,
              containerColor: Color = ContainerTeal,
              badgeText: String? = null,
              onClick: () -> Unit
          ) {
              Surface(
                  color = CardDark,
                  shape = segmentedShape(index, total),
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(vertical = 1.5.dp)
                      .clickable(onClick = onClick)
              ) {
                  Row(
                      verticalAlignment = Alignment.CenterVertically,
                      modifier = Modifier.padding(horizontal = 16.dp, vertical = 14.dp)
                  ) {
                      ExpressiveMorphIcon(
                          shapeType = shapeType,
                          containerColor = containerColor,
                          modifier = Modifier.size(44.dp)
                      ) {
                          Icon(icon, contentDescription = null, tint = TextWhite, modifier = Modifier.size(21.dp))
                      }

                      Column(
                          modifier = Modifier
                              .weight(1f)
                              .padding(horizontal = 14.dp)
                      ) {
                          Text(title, color = TextWhite, fontSize = 16.sp, fontWeight = FontWeight.SemiBold)
                          if (!subtitle.isNullOrEmpty()) {
                              Text(
                                  subtitle,
                                  color = TextSub,
                                  fontSize = 13.sp,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis
                              )
                          }
                      }

                      if (badgeText != null) {
                          Surface(
                              color = AccentTeal,
                              shape = RoundedCornerShape(50)
                          ) {
                              Text(
                                  text = badgeText,
                                  color = Color(0xFF0E1415),
                                  fontSize = 13.sp,
                                  fontWeight = FontWeight.Bold,
                                  modifier = Modifier.padding(horizontal = 14.dp, vertical = 6.dp)
                              )
                          }
                          Spacer(Modifier.width(8.dp))
                      }

                      Icon(
                          imageVector = Icons.Default.ChevronRight,
                          contentDescription = null,
                          tint = TextSub
                      )
                  }
              }
          }

          // ============================================================================
          // ПАРЯЩАЯ НИЖНЯЯ ПАНЕЛЬ НАВИГАЦИИ («ПИЛЮЛЯ» + КНОПКА ПОИСКА СПРАВА)
          // ============================================================================
          @Composable
          fun ExpressiveFloatingBottomBar(
              activeTab: Int,
              compactMode: Boolean,
              onSelectTab: (Int) -> Unit,
              onSearchClick: () -> Unit,
              modifier: Modifier = Modifier
          ) {
              val items = listOf(
                  Triple(0, Icons.Default.ChatBubbleOutline, "Чаты"),
                  Triple(1, Icons.Default.PeopleOutline, "Контакты"),
                  Triple(2, Icons.Default.PersonOutline, "Профиль"),
                  Triple(3, Icons.Default.Settings, "Настройки")
              )

              Row(
                  verticalAlignment = Alignment.CenterVertically,
                  horizontalArrangement = Arrangement.Center,
                  modifier = modifier
              ) {
                  Surface(
                      color = Color(0xFF121416),
                      shape = RoundedCornerShape(36.dp),
                      border = BorderStroke(1.dp, CardStroke),
                      shadowElevation = 10.dp
                  ) {
                      Row(
                          verticalAlignment = Alignment.CenterVertically,
                          modifier = Modifier
                              .animateContentSize(spring(stiffness = Spring.StiffnessMediumLow))
                              .padding(horizontal = 8.dp, vertical = 6.dp)
                      ) {
                          items.forEach { (index, icon, label) ->
                              val isSelected = activeTab == index
                              if (!compactMode || isSelected) {
                                  Surface(
                                      color = if (isSelected) ContainerTeal else Color.Transparent,
                                      shape = RoundedCornerShape(28.dp),
                                      modifier = Modifier
                                          .padding(horizontal = 3.dp)
                                          .clickable { onSelectTab(index) }
                                  ) {
                                      Row(
                                          verticalAlignment = Alignment.CenterVertically,
                                          modifier = Modifier.padding(
                                              horizontal = if (isSelected) 16.dp else 12.dp,
                                              vertical = 10.dp
                                          )
                                      ) {
                                          Icon(
                                              imageVector = icon,
                                              contentDescription = label,
                                              tint = TextWhite,
                                              modifier = Modifier.size(22.dp)
                                          )
                                          AnimatedVisibility(visible = isSelected) {
                                              Text(
                                                  text = label,
                                                  color = TextWhite,
                                                  fontSize = 14.sp,
                                                  fontWeight = FontWeight.Bold,
                                                  modifier = Modifier.padding(start = 8.dp)
                                              )
                                          }
                                      }
                                  }
                              }
                          }
                      }
                  }

                  Spacer(Modifier.width(10.dp))

                  // Отдельная бирюзовая кнопка «Поиск» справа от пилюли (как на референсе)
                  Surface(
                      color = ContainerTeal,
                      shape = RoundedCornerShape(22.dp),
                      border = BorderStroke(1.dp, AccentTeal.copy(alpha = 0.4f)),
                      shadowElevation = 10.dp,
                      modifier = Modifier
                          .size(54.dp)
                          .clickable(onClick = onSearchClick)
                  ) {
                      Box(contentAlignment = Alignment.Center) {
                          Icon(Icons.Default.Search, contentDescription = "Поиск", tint = TextWhite)
                      }
                  }
              }
          }

          // ============================================================================
          // ЭКРАН НАСТРОЕК (1-в-1 КАК В РЕФЕРЕНСЕ НА ВИДЕО)
          // ============================================================================
