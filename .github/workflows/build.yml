          @Composable
          fun SettingsScreenFromMockup(
              user: UserAccount,
              theme: AppThemeMode,
              onSelectTheme: (AppThemeMode) -> Unit,
              onUpdateUser: (UserAccount) -> Unit,
              onEditAvatar: (Bitmap, (Bitmap) -> Unit) -> Unit,
              onLogout: () -> Unit
          ) {
              val context = LocalContext.current
              var showEditProfileDialog by remember { mutableStateOf(false) }
              val themeList = remember { AppThemeMode.values().toList() }

              val galleryLauncher = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.GetContent()
              ) { uri: Uri? ->
                  if (uri != null) {
                      val bmp = loadBitmapFromUri(context, uri)
                      if (bmp != null) {
                          onEditAvatar(bmp) { editedBmp ->
                              onUpdateUser(user.copy(avatarBitmap = editedBmp))
                          }
                      }
                  }
              }

              LazyColumn(
                  contentPadding = PaddingValues(horizontal = 20.dp, vertical = 20.dp),
                  modifier = Modifier.fillMaxSize()
              ) {
                  item {
                      Text(
                          text = "Настройки",
                          color = theme.textMain,
                          fontSize = 28.sp,
                          fontWeight = FontWeight.Bold
