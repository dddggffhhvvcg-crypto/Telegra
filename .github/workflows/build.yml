                      }
                  }

                  // Секция: Ивент
                  item { SectionHeader("Ивент") }
                  item {
                      SegmentedSettingCard(
                          index = 0,
                          total = 1,
                          icon = Icons.Default.Celebration,
                          title = "Ивент",
                          subtitle = "Halloween",
                          shapeType = ShapeType.SUNNY,
                          containerColor = ContainerPurple,
                          badgeText = "Подарок",
                          onClick = onOpenEvent
                      )
                  }

                  // Секция: Оформление и язык
                  item { SectionHeader("Оформление и язык") }
                  item {
                      SegmentedSettingCard(
                          index = 0,
                          total = 3,
                          icon = Icons.Default.Palette,
                          title = "Темы",
                          subtitle = "Оформление и цвет переписки",
