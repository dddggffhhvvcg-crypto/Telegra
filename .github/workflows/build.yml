                          containerColor = ContainerTeal,
                          onClick = { onToast("Тема: Expressive Dark (#0E0F11)") }
                      )
                  }
                  item {
                      SegmentedSettingCard(
                          index = 1,
                          total = 3,
                          icon = Icons.Default.AutoAwesome,
                          title = "Изменить",
                          subtitle = "Аватарки, фон чата, эмодзи, реакции",
                          shapeType = ShapeType.PENTAGON,
                          containerColor = ContainerTeal,
                          onClick = { onToast("Настройка рамок и реакций 🎃👻🕸️") }
                      )
                  }
                  item {
                      SegmentedSettingCard(
                          index = 2,
                          total = 3,
                          icon = Icons.Default.Language,
                          title = "Язык",
                          subtitle = "Язык приложения и свои локализации",
                          shapeType = ShapeType.HEXAGON,
                          containerColor = ContainerTeal,
                          onClick = { onToast("Язык по умолчанию: Русский") }
                      )
                  }

                  // Секция: Моё
                  item { SectionHeader("Моё") }
                  item {
                      SegmentedSettingCard(
                          index = 0,
                          total = 3,
                          icon = Icons.Default.Bookmark,
                          title = "Избранное",
                          subtitle = "Заметки и файлы",
                          shapeType = ShapeType.CLOVER,
                          containerColor = ContainerPurple,
                          onClick = onOpenSaved
                      )
                  }
                  item {
                      SegmentedSettingCard(
                          index = 1,
                          total = 3,
                          icon = Icons.Default.History,
                          title = "Истории",
                          subtitle = "Истории тех, кто в контактах",
                          shapeType = ShapeType.COOKIE,
                          containerColor = ContainerPurple,
                          onClick = { onToast("Раздел историй") }
                      )
                  }
                  item {
                      SegmentedSettingCard(
                          index = 2,
                          total = 3,
                          icon = Icons.Default.Folder,
                          title = "Папки с чатами",
                          subtitle = "Все, Личные, Группы, Каналы",
