                          shape = RoundedCornerShape(22.dp),
                          modifier = Modifier
                              .fillMaxWidth()
                              .clickable { expandAccounts = !expandAccounts }
                      ) {
                          Column(modifier = Modifier.padding(horizontal = 16.dp, vertical = 14.dp)) {
                              Row(verticalAlignment = Alignment.CenterVertically) {
