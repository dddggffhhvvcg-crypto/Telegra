                                              tint = Color.White,
                                              modifier = Modifier.size(13.dp)
                                          )
                                      }
                                  }
                              }

                              Spacer(Modifier.width(16.dp))

                              Column(modifier = Modifier.weight(1f)) {
                                  Text(
                                      text = user.name,
                                      color = theme.textMain,
                                      fontSize = 20.sp,
                                      fontWeight = FontWeight.Bold
                                  )
                                  Spacer(Modifier.height(2.dp))
                                  Text(
                                      text = "@${user.username}",
                                      color = theme.accent,
                                      fontSize = 14.sp,
                                      fontWeight = FontWeight.Medium
                                  )
                              }

                              IconButton(onClick = { showEditProfileDialog = true }) {
                                  Icon(Icons.Default.Edit, contentDescription = "Изменить имя", tint = theme.textSub)
                              }
                          }
                      }
                      Spacer(Modifier.height(24.dp))
                  }

                  item {
                      Text(
                          text = "ОФОРМЛЕНИЕ",
                          color = theme.textSub,
                          fontSize = 12.sp,
                          fontWeight = FontWeight.Bold,
                          letterSpacing = 1.sp
                      )
                      Spacer(Modifier.height(12.dp))

                      LazyRow(
                          horizontalArrangement = Arrangement.spacedBy(12.dp),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          items(themeList) { itemTheme ->
                              val isSelected = itemTheme == theme
                              ThemePreviewCard(
                                  itemTheme = itemTheme,
                                  isSelected = isSelected,
                                  onClick = { onSelectTheme(itemTheme) }
                              )
                          }
                      }
                      Spacer(Modifier.height(24.dp))
                  }

                  item {
                      Surface(
                          color = theme.card,
                          shape = RoundedCornerShape(20.dp),
                          border = BorderStroke(1.dp, theme.stroke),
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Column {
                              SettingsInfoRow(
                                  label = "Юзернейм",
                                  value = "@${user.username}",
                                  theme = theme
                              )
                              HorizontalDivider(color = theme.stroke)
                              SettingsInfoRow(
                                  label = "Шифрование",
                                  value = "ChaCha20 + HMAC",
                                  theme = theme
                              )
                          }
                      }
                      Spacer(Modifier.height(24.dp))
                  }

                  item {
                      OutlinedButton(
                          onClick = onLogout,
                          shape = RoundedCornerShape(16.dp),
                          border = BorderStroke(1.dp, Color(0xFFFF5C5C).copy(alpha = 0.5f)),
                          modifier = Modifier
                              .fillMaxWidth()
                              .height(52.dp)
                      ) {
                          Text(
                              text = "Выйти из аккаунта",
                              color = Color(0xFFFF6B6B),
                              fontSize = 15.sp,
                              fontWeight = FontWeight.SemiBold
                          )
                      }
                  }
              }

              if (showEditProfileDialog) {
                  var newName by remember { mutableStateOf(user.name) }
                  var newUsername by remember { mutableStateOf(user.username) }
                  AlertDialog(
                      onDismissRequest = { showEditProfileDialog = false },
                      containerColor = theme.card,
                      title = { Text("Редактировать профиль", color = theme.textMain) },
