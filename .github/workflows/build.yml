name: Build Messenger APK & Project ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean Old Files & Generate Project Structure
        run: |
          rm -rf app build.gradle build.gradle.kts settings.gradle settings.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/mychat/app
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Messenger"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.mychat.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.mychat.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 4
                  versionName = "4.0"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(composeBom)
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("androidx.activity:activity-compose:1.9.1")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-graphics")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:icon="@android:drawable/sym_action_chat"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Messenger</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/java/com/mychat/app/MainActivity.kt
          package com.mychat.app

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Canvas as AndroidCanvas
          import android.graphics.ColorMatrix
          import android.graphics.ColorMatrixColorFilter
          import android.graphics.Matrix
          import android.graphics.Paint as AndroidPaint
          import android.net.Uri
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.gestures.detectDragGestures
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.automirrored.filled.ArrowBack
          import androidx.compose.material.icons.automirrored.filled.Send
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.Path
          import androidx.compose.ui.graphics.StrokeCap
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.graphics.drawscope.Stroke
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.text.input.VisualTransformation
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          enum class AppThemeMode(
              val title: String,
              val bg: Color,
              val card: Color,
              val inputBg: Color,
              val stroke: Color,
              val accent: Color,
              val accentSecond: Color,
              val myBubble: Color,
              val theirBubble: Color,
              val textMain: Color,
              val textSub: Color
          ) {
              MIDNIGHT(
                  title = "Полночь",
                  bg = Color(0xFF0B0E17),
                  card = Color(0xFF131826),
                  inputBg = Color(0xFF171D2E),
                  stroke = Color(0xFF252E47),
                  accent = Color(0xFF637BFF),
                  accentSecond = Color(0xFF865CFF),
                  myBubble = Color(0xFF5668F6),
                  theirBubble = Color(0xFF192033),
                  textMain = Color(0xFFF3F6FF),
                  textSub = Color(0xFF7D89A8)
              ),
              BLACK(
                  title = "Чёрная",
                  bg = Color(0xFF000000),
                  card = Color(0xFF0D0E12),
                  inputBg = Color(0xFF12141A),
                  stroke = Color(0xFF222530),
                  accent = Color(0xFF5B72FF),
                  accentSecond = Color(0xFF7B5CFF),
                  myBubble = Color(0xFF4E62E6),
                  theirBubble = Color(0xFF14161D),
                  textMain = Color(0xFFFFFFFF),
                  textSub = Color(0xFF7C808E)
              ),
              DAY(
                  title = "День",
                  bg = Color(0xFFF4F6FB),
                  card = Color(0xFFFFFFFF),
                  inputBg = Color(0xFFEBEEF7),
                  stroke = Color(0xFFDCE1F0),
                  accent = Color(0xFF4A62F0),
                  accentSecond = Color(0xFF6E4FF0),
                  myBubble = Color(0xFF4A62F0),
                  theirBubble = Color(0xFFE6EAF5),
                  textMain = Color(0xFF111524),
                  textSub = Color(0xFF6A738C)
              ),
              SUNSET(
                  title = "Закат",
                  bg = Color(0xFF140D18),
                  card = Color(0xFF211528),
                  inputBg = Color(0xFF2B1C34),
                  stroke = Color(0xFF3E294B),
                  accent = Color(0xFFFF6B8B),
                  accentSecond = Color(0xFFFF8E53),
                  myBubble = Color(0xFFE85478),
                  theirBubble = Color(0xFF281A30),
                  textMain = Color(0xFFFFF4F7),
                  textSub = Color(0xFFA8899E)
              )
          }

          data class UserAccount(
              val name: String,
              val username: String,
              val bio: String = "",
              val avatarBitmap: Bitmap? = null
          )

          data class MessageItem(
              val id: Long,
              val author: String,
              val text: String,
              val time: String,
              val isMine: Boolean,
              val imageBitmap: Bitmap? = null
          )

          data class ChatChannel(
              val id: String,
              val title: String,
              val username: String,
              val description: String = "",
              val isChannel: Boolean = false,
              val avatarBitmap: Bitmap? = null,
              val messages: MutableList<MessageItem> = mutableStateListOf()
          )

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MessengerApp()
                  }
              }
          }

          @Composable
          fun MessengerApp() {
              val context = LocalContext.current
              val prefs = remember { context.getSharedPreferences("messenger_prefs_v4", Context.MODE_PRIVATE) }

              var themeMode by remember {
                  val savedTheme = prefs.getString("theme", AppThemeMode.MIDNIGHT.name) ?: AppThemeMode.MIDNIGHT.name
                  mutableStateOf(runCatching { AppThemeMode.valueOf(savedTheme) }.getOrDefault(AppThemeMode.MIDNIGHT))
              }

              var currentUser by remember {
                  val savedUsername = prefs.getString("username", "") ?: ""
                  val savedName = prefs.getString("name", "") ?: ""
                  mutableStateOf(
                      if (savedUsername.isNotEmpty()) UserAccount(name = savedName, username = savedUsername)
                      else null
                  )
              }

              // Список чатов изначально пустой (без чужих переписок из скринов)
              val chats = remember { mutableStateListOf<ChatChannel>() }

              // Пользователи для поиска по @юзернейму (без отображения Email!)
              val directoryUsers = remember {
                  mutableStateListOf(
                      UserAccount(name = "Поддержка Messenger", username = "support", bio = "Официальный аккаунт"),
                      UserAccount(name = "Новости и релизы", username = "releases", bio = "Канал обновлений")
                  )
              }

              var currentTab by remember { mutableIntStateOf(0) }
              var activeChatId by remember { mutableStateOf<String?>(null) }
              var showCreateChannelDialog by remember { mutableStateOf(false) }
              var editingChannel by remember { mutableStateOf<ChatChannel?>(null) }

              var pendingEditBitmap by remember { mutableStateOf<Bitmap?>(null) }
              var onPhotoEditedCallback by remember { mutableStateOf<((Bitmap) -> Unit)?>(null) }

              fun openPhotoEditor(bitmap: Bitmap, onDone: (Bitmap) -> Unit) {
                  pendingEditBitmap = bitmap
                  onPhotoEditedCallback = onDone
              }

              MaterialTheme {
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(themeMode.bg)
                  ) {
                      if (pendingEditBitmap != null) {
                          FullPhotoEditorScreen(
                              initialBitmap = pendingEditBitmap!!,
                              theme = themeMode,
                              onCancel = {
                                  pendingEditBitmap = null
                                  onPhotoEditedCallback = null
                              },
                              onSave = { edited ->
                                  val cb = onPhotoEditedCallback
                                  pendingEditBitmap = null
                                  onPhotoEditedCallback = null
                                  cb?.invoke(edited)
                              }
                          )
                          return@Box
                      }

                      if (currentUser == null) {
                          AuthScreenFromMockup(
                              theme = themeMode,
                              onAuthSuccess = { account ->
                                  prefs.edit()
                                      .putString("name", account.name)
                                      .putString("username", account.username)
                                      .apply()
                                  currentUser = account
                                  currentTab = 0
                              }
                          )
                      } else {
                          val openedChat = chats.find { it.id == activeChatId }
                          if (openedChat != null) {
                              ChatConversationScreen(
                                  chat = openedChat,
                                  theme = themeMode,
                                  onBack = { activeChatId = null },
                                  onEditChannel = { editingChannel = openedChat },
                                  onEditPhotoRequest = { bmp, done -> openPhotoEditor(bmp, done) }
                              )
                          } else {
                              Column(modifier = Modifier.fillMaxSize()) {
                                  Box(modifier = Modifier.weight(1f)) {
                                      when (currentTab) {
                                          0 -> ChatsListScreen(
                                              chats = chats,
                                              theme = themeMode,
                                              onOpenChat = { activeChatId = it.id },
                                              onCreateClick = { showCreateChannelDialog = true }
                                          )
                                          1 -> SearchByUsernameScreen(
                                              directory = directoryUsers,
                                              theme = themeMode,
                                              onOpenOrStartChat = { user ->
                                                  val existing = chats.find { it.username.equals(user.username, true) }
                                                  if (existing != null) {
                                                      activeChatId = existing.id
                                                  } else {
                                                      val newChat = ChatChannel(
                                                          id = "chat_${System.currentTimeMillis()}",
                                                          title = user.name,
                                                          username = user.username,
                                                          isChannel = false,
                                                          avatarBitmap = user.avatarBitmap
                                                      )
                                                      chats.add(0, newChat)
                                                      activeChatId = newChat.id
                                                  }
                                              }
                                          )
                                          2 -> SettingsScreenFromMockup(
                                              user = currentUser!!,
                                              theme = themeMode,
                                              onSelectTheme = { newTheme ->
                                                  themeMode = newTheme
                                                  prefs.edit().putString("theme", newTheme.name).apply()
                                              },
                                              onUpdateUser = { updated ->
                                                  currentUser = updated
                                                  prefs.edit()
                                                      .putString("name", updated.name)
                                                      .putString("username", updated.username)
                                                      .apply()
                                              },
                                              onEditAvatar = { bmp, done -> openPhotoEditor(bmp, done) },
                                              onLogout = {
                                                  prefs.edit().clear().apply()
                                                  currentUser = null
                                              }
                                          )
                                      }
                                  }

                                  BottomBarFromMockup(
                                      currentTab = currentTab,
                                      theme = themeMode,
                                      onSelectTab = { currentTab = it }
                                  )
                              }
                          }
                      }

                      if (showCreateChannelDialog) {
                          CreateOrEditChannelDialog(
                              theme = themeMode,
                              initialChannel = null,
                              onDismiss = { showCreateChannelDialog = false },
                              onEditPhoto = { bmp, done -> openPhotoEditor(bmp, done) },
                              onConfirm = { newChannel ->
                                  chats.add(0, newChannel)
                                  showCreateChannelDialog = false
                                  activeChatId = newChannel.id
                              }
                          )
                      }

                      if (editingChannel != null) {
                          CreateOrEditChannelDialog(
                              theme = themeMode,
                              initialChannel = editingChannel,
                              onDismiss = { editingChannel = null },
                              onEditPhoto = { bmp, done -> openPhotoEditor(bmp, done) },
                              onConfirm = { updated ->
                                  val idx = chats.indexOfFirst { it.id == updated.id }
                                  if (idx != -1) {
                                      chats[idx] = updated
                                  }
                                  editingChannel = null
                              }
                          )
                      }
                  }
              }
          }

          @Composable
          fun AuthScreenFromMockup(
              theme: AppThemeMode,
              onAuthSuccess: (UserAccount) -> Unit
          ) {
              var isRegister by remember { mutableStateOf(true) }
              var name by remember { mutableStateOf("") }
              var username by remember { mutableStateOf("") }
              var email by remember { mutableStateOf("") }
              var password by remember { mutableStateOf("") }
              var showPassword by remember { mutableStateOf(false) }
              var errorMsg by remember { mutableStateOf<String?>(null) }

              val cleanUsername = username.removePrefix("@").trim().lowercase()
              val isUsernameFree = cleanUsername.length >= 4 && cleanUsername != "admin"

              Column(
                  horizontalAlignment = Alignment.CenterHorizontally,
                  modifier = Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(horizontal = 24.dp, vertical = 36.dp)
              ) {
                  Spacer(Modifier.height(12.dp))

                  Box(
                      contentAlignment = Alignment.Center,
                      modifier = Modifier
                          .size(84.dp)
                          .clip(RoundedCornerShape(24.dp))
                          .background(
                              Brush.linearGradient(
                                  colors = listOf(Color(0xFF5B86FF), Color(0xFF7B5CFF))
                              )
                          )
                  ) {
                      Icon(
                          imageVector = Icons.Default.ChatBubbleOutline,
                          contentDescription = null,
                          tint = Color(0xFF0D101B),
                          modifier = Modifier.size(40.dp)
                      )
                  }

                  Spacer(Modifier.height(16.dp))

                  Text(
                      text = "Messenger",
                      color = theme.textMain,
                      fontSize = 28.sp,
                      fontWeight = FontWeight.Bold
                  )
                  Spacer(Modifier.height(4.dp))
                  Text(
                      text = "Чаты, группы и каналы",
                      color = theme.textSub,
                      fontSize = 15.sp
                  )

                  Spacer(Modifier.height(24.dp))

                  Surface(
                      color = theme.card,
                      shape = RoundedCornerShape(16.dp),
                      border = BorderStroke(1.dp, theme.stroke),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Row(modifier = Modifier.padding(4.dp)) {
                          val modes = listOf(Pair(false, "Вход"), Pair(true, "Регистрация"))
                          modes.forEach { pair ->
                              val regMode = pair.first
                              val title = pair.second
                              val selected = isRegister == regMode
                              Surface(
                                  color = if (selected) theme.accent else Color.Transparent,
                                  shape = RoundedCornerShape(12.dp),
                                  modifier = Modifier
                                      .weight(1f)
                                      .clickable {
                                          isRegister = regMode
                                          errorMsg = null
                                      }
                              ) {
                                  Text(
                                      text = title,
                                      color = if (selected) Color.White else theme.textSub,
                                      fontWeight = FontWeight.SemiBold,
                                      fontSize = 15.sp,
                                      textAlign = TextAlign.Center,
                                      modifier = Modifier.padding(vertical = 11.dp)
                                  )
                              }
                          }
                      }
                  }

                  Spacer(Modifier.height(18.dp))

                  if (isRegister) {
                      MockupInputField(
                          value = name,
                          onValueChange = { name = it; errorMsg = null },
                          placeholder = "Имя (например, Алекс)",
                          leadingIcon = Icons.Default.PersonOutline,
                          theme = theme
                      )
                      Spacer(Modifier.height(12.dp))
                  }

                  MockupInputField(
                      value = username,
                      onValueChange = {
                          username = it.filter { ch -> ch.isLetterOrDigit() || ch == '_' || ch == '@' }.take(32)
                          errorMsg = null
                      },
                      placeholder = "@юзернейм",
                      leadingIcon = Icons.Default.AlternateEmail,
                      trailingContent = {
                          if (isRegister && cleanUsername.isNotEmpty()) {
                              Text(
                                  text = if (isUsernameFree) "@$cleanUsername свободен" else "Мин. 4 симв.",
                                  color = if (isUsernameFree) Color(0xFF4CD97B) else theme.textSub,
                                  fontSize = 12.sp,
                                  fontWeight = FontWeight.Medium
                              )
                          }
                      },
                      theme = theme
                  )

                  if (isRegister) {
                      Spacer(Modifier.height(12.dp))
                      MockupInputField(
                          value = email,
                          onValueChange = { email = it; errorMsg = null },
                          placeholder = "Почта (только при регистрации)",
                          leadingIcon = Icons.Default.Email,
                          theme = theme
                      )
                  }

                  Spacer(Modifier.height(12.dp))

                  MockupInputField(
                      value = password,
                      onValueChange = { password = it; errorMsg = null },
                      placeholder = "Пароль",
                      leadingIcon = Icons.Default.Lock,
                      isPassword = !showPassword,
                      trailingContent = {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              if (isRegister && password.isNotEmpty()) {
                                  val quality = when {
                                      password.length >= 8 -> "Отличный"
                                      password.length >= 5 -> "Хороший"
                                      else -> "Слабый"
                                  }
                                  val qColor = if (password.length >= 5) Color(0xFF4CD97B) else Color(0xFFFF8A80)
                                  Text(quality, color = qColor, fontSize = 12.sp, modifier = Modifier.padding(end = 6.dp))
                              }
                              IconButton(
                                  onClick = { showPassword = !showPassword },
                                  modifier = Modifier.size(28.dp)
                              ) {
                                  Icon(
                                      imageVector = if (showPassword) Icons.Default.VisibilityOff else Icons.Default.Visibility,
                                      contentDescription = null,
                                      tint = theme.textSub,
                                      modifier = Modifier.size(18.dp)
                                  )
                              }
                          }
                      },
                      theme = theme
                  )

                  if (errorMsg != null) {
                      Spacer(Modifier.height(10.dp))
                      Text(errorMsg!!, color = Color(0xFFFF6B6B), fontSize = 13.sp)
                  }

                  Spacer(Modifier.height(22.dp))

                  Button(
                      onClick = {
                          if (cleanUsername.length < 4) {
                              errorMsg = "Введите @юзернейм (от 4 символов)"
                              return@Button
                          }
                          if (isRegister && name.isBlank()) {
                              errorMsg = "Введите ваше имя"
                              return@Button
                          }
                          if (isRegister && !email.contains("@")) {
                              errorMsg = "Введите корректную почту"
                              return@Button
                          }
                          if (password.length < 4) {
                              errorMsg = "Пароль должен быть от 4 символов"
                              return@Button
                          }
                          val finalName = if (isRegister) name.trim() else cleanUsername.replaceFirstChar { it.uppercase() }
                          onAuthSuccess(UserAccount(name = finalName, username = cleanUsername))
                      },
                      colors = ButtonDefaults.buttonColors(containerColor = Color.Transparent),
                      contentPadding = PaddingValues(),
                      shape = RoundedCornerShape(16.dp),
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(54.dp)
                  ) {
                      Box(
                          contentAlignment = Alignment.Center,
                          modifier = Modifier
                              .fillMaxSize()
                              .background(
                                  Brush.horizontalGradient(
                                      listOf(theme.accent, theme.accentSecond)
                                  ),
                                  shape = RoundedCornerShape(16.dp)
                              )
                      ) {
                          Text(
                              text = if (isRegister) "Создать аккаунт" else "Войти",
                              color = Color.White,
                              fontSize = 16.sp,
                              fontWeight = FontWeight.Bold
                          )
                      }
                  }
              }
          }

          @Composable
          fun MockupInputField(
              value: String,
              onValueChange: (String) -> Unit,
              placeholder: String,
              leadingIcon: ImageVector,
              theme: AppThemeMode,
              isPassword: Boolean = false,
              trailingContent: (@Composable () -> Unit)? = null
          ) {
              Surface(
                  color = theme.inputBg,
                  shape = RoundedCornerShape(16.dp),
                  border = BorderStroke(1.dp, theme.stroke),
                  modifier = Modifier.fillMaxWidth()
              ) {
                  Row(
                      verticalAlignment = Alignment.CenterVertically,
                      modifier = Modifier.padding(horizontal = 14.dp, vertical = 4.dp)
                  ) {
                      Icon(leadingIcon, contentDescription = null, tint = theme.textSub, modifier = Modifier.size(20.dp))
                      Spacer(Modifier.width(10.dp))
                      TextField(
                          value = value,
                          onValueChange = onValueChange,
                          placeholder = { Text(placeholder, color = theme.textSub, fontSize = 15.sp) },
                          singleLine = true,
                          visualTransformation = if (isPassword) PasswordVisualTransformation() else VisualTransformation.None,
                          colors = TextFieldDefaults.colors(
                              focusedTextColor = theme.textMain,
                              unfocusedTextColor = theme.textMain,
                              focusedContainerColor = Color.Transparent,
                              unfocusedContainerColor = Color.Transparent,
                              focusedIndicatorColor = Color.Transparent,
                              unfocusedIndicatorColor = Color.Transparent,
                              cursorColor = theme.accent
                          ),
                          modifier = Modifier.weight(1f)
                      )
                      if (trailingContent != null) {
                          trailingContent()
                      }
                  }
              }
          }

          @Composable
          fun ChatsListScreen(
              chats: List<ChatChannel>,
              theme: AppThemeMode,
              onOpenChat: (ChatChannel) -> Unit,
              onCreateClick: () -> Unit
          ) {
