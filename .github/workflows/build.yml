          // ============================================================================
          // ЭКРАН ИВЕНТА HALLOWEEN (С МОРФИНГОМ, ПОЛЗУНКОМ, 3 НАГРАДАМИ И ВСПЫШКОЙ)
          // ============================================================================
          @Composable
          fun HalloweenEventScreen(
              onBack: () -> Unit,
              onRewardSelected: (String) -> Unit
          ) {
              val view = LocalView.current
              val scope = rememberCoroutineScope()

              // Стадии ивента как на видео:
              // 0: Главный экран с ползунком «Потяните, чтобы открыть»
              // 1: Анимация открытия (Android Case -> Нажми)
              // 2: «Выберите одну» из 3 морф-наград
              // 3: Белая вспышка и возврат в настройки
              var stage by remember { mutableIntStateOf(0) }
              var dragProgress by remember { mutableFloatStateOf(0f) }
              var whiteFlashAlpha by remember { mutableFloatStateOf(0f) }

              BackHandler(onBack = onBack)

              val infinite = rememberInfiniteTransition(label = "bg_shapes")
              val floatAnim by infinite.animateFloat(
                  initialValue = 0f,
                  targetValue = 1f,
                  animationSpec = infiniteRepeatable(tween(5000, easing = LinearEasing), RepeatMode.Reverse),
                  label = "float"
              )

              Box(modifier = Modifier.fillMaxSize().background(BgDark)) {
                  // Плывущие полупрозрачные формы на фоне (появляются при протягивании ползунка)
                  val bgAlpha = (dragProgress * 0.9f).coerceAtLeast(if (stage > 0) 0.85f else 0f)
                  if (bgAlpha > 0.02f) {
                      Canvas(modifier = Modifier.fillMaxSize().alpha(bgAlpha)) {
                          val circles = listOf(
                              Triple(0.2f, 0.18f, 190f),
                              Triple(0.85f, 0.25f, 240f),
                              Triple(0.15f, 0.75f, 220f),
                              Triple(0.8f, 0.72f, 260f),
                              Triple(0.5f, 0.45f, 160f)
                          )
                          circles.forEachIndexed { idx, (rx, ry, rad) ->
                              val dy = sin((floatAnim + idx * 0.3f) * 3.14f).toFloat() * 40f
                              drawCircle(
                                  color = if (idx % 2 == 0) ContainerTeal.copy(alpha = 0.45f) else ContainerPurple.copy(alpha = 0.4f),
                                  radius = rad * (0.8f + dragProgress * 0.4f),
                                  center = Offset(size.width * rx, size.height * ry + dy)
                              )
                          }
                      }
                  }

                  when (stage) {
                      0 -> {
                          LazyColumn(
                              contentPadding = PaddingValues(16.dp),
                              modifier = Modifier.fillMaxSize()
                          ) {
                              // Кастомный верхний бар: круглая кнопка назад + чип «Ивент»
                              item {
                                  Row(
                                      verticalAlignment = Alignment.CenterVertically,
                                      modifier = Modifier.padding(top = 8.dp, bottom = 20.dp)
                                  ) {
                                      Surface(
                                          color = CardDark,
                                          shape = CircleShape,
                                          modifier = Modifier.size(44.dp).clickable(onClick = onBack)
                                      ) {
                                          Box(contentAlignment = Alignment.Center) {
                                              Icon(Icons.AutoMirrored.Filled.ArrowBack, contentDescription = "Назад", tint = TextWhite)
                                          }
                                      }
                                      Spacer(Modifier.width(10.dp))
                                      Surface(color = CardDark, shape = RoundedCornerShape(50)) {
                                          Row(
                                              verticalAlignment = Alignment.CenterVertically,
                                              modifier = Modifier.padding(horizontal = 16.dp, vertical = 10.dp)
                                          ) {
                                              Text("🎃", fontSize = 16.sp)
                                              Spacer(Modifier.width(8.dp))
                                              Text("Ивент", color = TextWhite, fontWeight = FontWeight.Bold, fontSize = 16.sp)
                                          }
                                      }
                                  }
                              }

                              // Большая морф-форма с тыквой в центре
                              item {
                                  Column(
                                      horizontalAlignment = Alignment.CenterHorizontally,
                                      modifier = Modifier.fillMaxWidth().padding(vertical = 12.dp)
                                  ) {
                                      val scale = 1f + dragProgress * 0.25f
                                      val lobes = if (dragProgress > 0.5f) 8 else 12
                                      ExpressiveMorphIcon(
                                          shapeType = ShapeType.SUNNY,
                                          lobeCountOverride = lobes,
                                          containerColor = Color(0xFF394E50),
                                          modifier = Modifier.size(190.dp).scale(scale).rotate(dragProgress * 35f)
                                      ) {
                                          Text("🎃", fontSize = 74.sp)
                                      }
                                      Spacer(Modifier.height(14.dp))
                                      Text(
                                          text = if (dragProgress > 0.8f) "Android Case" else "Halloween",
                                          color = TextWhite,
                                          fontSize = 32.sp,
                                          fontWeight = FontWeight.Bold
                                      )
                                  }
                              }

                              // Ползунок «Потяните, чтобы открыть»
                              item {
                                  Spacer(Modifier.height(14.dp))
                                  EventSlideToOpen(
                                      progress = dragProgress,
                                      onProgressChange = { p ->
                                          dragProgress = p
                                      },
                                      onUnlocked = {
                                          view.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                                          stage = 1
                                      }
                                  )
                                  Spacer(Modifier.height(22.dp))
                              }

                              // 3 сегментированные карточки описания под ползунком (как на видео 00:03)
                              item {
                                  Surface(
                                      color = CardDark,
                                      shape = segmentedShape(0, 3),
                                      modifier = Modifier.fillMaxWidth().padding(vertical = 1.5.dp)
                                  ) {
                                      Column(modifier = Modifier.padding(18.dp)) {
                                          Text("Тема «Хэллоуин»", color = TextWhite, fontWeight = FontWeight.Bold, fontSize = 16.sp)
                                          Spacer(Modifier.height(4.dp))
                                          Text(
                                              "Первая плитка в списке цветов. На обоях плывут тыквы, призраки и летучие мыши.",
                                              color = TextSub,
                                              fontSize = 14.sp
                                          )
                                      }
                                  }
                              }
                              item {
                                  Surface(
                                      color = CardDark,
                                      shape = segmentedShape(1, 3),
                                      modifier = Modifier.fillMaxWidth().padding(vertical = 1.5.dp)
                                  ) {
                                      Column(modifier = Modifier.padding(18.dp)) {
                                          Text("Реакции", color = TextWhite, fontWeight = FontWeight.Bold, fontSize = 16.sp)
                                          Spacer(Modifier.height(4.dp))
                                          Text(
                                              "Над обычными реакциями стоит вторая пилюля: 🎃 👻 🕸️ 🕷️ 🧛 🍬. Удержите любую, чтобы увидеть большой эффект.",
                                              color = TextSub,
                                              fontSize = 14.sp
                                          )
                                      }
                                  }
                              }
                              item {
                                  Surface(
                                      color = CardDark,
                                      shape = segmentedShape(2, 3),
                                      modifier = Modifier.fillMaxWidth().padding(vertical = 1.5.dp)
                                  ) {
                                      Column(modifier = Modifier.padding(18.dp)) {
                                          Text("Скоро", color = TextWhite, fontWeight = FontWeight.Bold, fontSize = 16.sp)
                                          Spacer(Modifier.height(4.dp))
                                          Text(
                                              "«Сладость или гадость» раз в день с монетками и хэллоуинские подарки.",
                                              color = TextSub,
                                              fontSize = 14.sp
                                          )
                                      }
                                  }
                              }
                          }
                      }

                      // Стадия 1: Демонстрация наград и экран «Нажми» (00:08)
                      1 -> {
                          Column(
                              horizontalAlignment = Alignment.CenterHorizontally,
                              verticalArrangement = Arrangement.Center,
                              modifier = Modifier
                                  .fillMaxSize()
                                  .clickable {
                                      view.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP)
                                      stage = 2
                                  }
                          ) {
                              ExpressiveMorphIcon(
                                  shapeType = ShapeType.SUNNY,
                                  containerColor = Color(0xFF34494B),
                                  modifier = Modifier.size(180.dp)
                              ) {
                                  Text("🎃", fontSize = 70.sp)
                              }
                              Spacer(Modifier.height(120.dp))
                              Text("Нажми", color = TextWhite, fontSize = 22.sp, fontWeight = FontWeight.Bold)
                          }
                      }

                      // Стадия 2: «Выберите одну» из 3 наград (00:11 - 00:15)
                      2 -> {
                          val rewards = listOf(
                              Triple("👻", "Рамка кружков\n«Хэллоуин»", "Рамка кружков «Хэллоуин»"),
                              Triple("🎃", "Рамка аватарки\n«Хэллоуин»", "Рамка аватарки «Хэллоуин»"),
                              Triple("👤4", "Четвёртый\nаккаунт", "Четвёртый аккаунт")
                          )

                          Column(
                              horizontalAlignment = Alignment.CenterHorizontally,
                              verticalArrangement = Arrangement.Center,
                              modifier = Modifier.fillMaxSize().padding(16.dp)
                          ) {
                              Text("Выберите одну", color = TextWhite, fontSize = 24.sp, fontWeight = FontWeight.Bold)
                              Spacer(Modifier.height(36.dp))
                              Row(
                                  horizontalArrangement = Arrangement.SpaceEvenly,
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  rewards.forEachIndexed { idx, (emoji, label, fullReward) ->
                                      Column(
                                          horizontalAlignment = Alignment.CenterHorizontally,
                                          modifier = Modifier
                                              .weight(1f)
                                              .clickable {
                                                  view.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS)
                                                  scope.launch {
                                                      // Светлая вспышка на весь экран (00:18)
                                                      for (i in 1..10) {
                                                          whiteFlashAlpha = i / 10f
                                                          delay(25)
                                                      }
                                                      delay(220)
                                                      onRewardSelected(fullReward)
                                                  }
                                              }
                                      ) {
                                          ExpressiveMorphIcon(
                                              shapeType = if (idx == 0) ShapeType.CLOVER else if (idx == 1) ShapeType.SUNNY else ShapeType.COOKIE,
                                              containerColor = Color(0xFF344E50),
                                              modifier = Modifier.size(96.dp)
                                          ) {
                                              Text(emoji, fontSize = 34.sp, color = TextWhite)
                                          }
                                          Spacer(Modifier.height(10.dp))
                                          Text(
                                              text = label,
                                              color = TextWhite,
                                              fontSize = 13.sp,
                                              fontWeight = FontWeight.SemiBold,
                                              textAlign = TextAlign.Center
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }

                  // Белая вспышка при открытии подарка
                  if (whiteFlashAlpha > 0f) {
                      Box(
                          modifier = Modifier
                              .fillMaxSize()
                              .background(Color.White.copy(alpha = whiteFlashAlpha))
                      )
                  }
              }
          }

          @Composable
          fun EventSlideToOpen(
              progress: Float,
              onProgressChange: (Float) -> Unit,
              onUnlocked: () -> Unit
          ) {
              var trackWidthPx by remember { mutableFloatStateOf(1f) }
              val thumbSizeDp = 56.dp
              val density = LocalDensity.current
              val thumbSizePx = with(density) { thumbSizeDp.toPx() }
              val maxDragPx = (trackWidthPx - thumbSizePx - with(density) { 16.dp.toPx() }).coerceAtLeast(1f)

              Surface(
                  color = CardDark,
                  shape = RoundedCornerShape(36.dp),
                  border = BorderStroke(1.dp, CardStroke),
                  modifier = Modifier
                      .fillMaxWidth()
                      .height(68.dp)
                      .onSizeChanged { trackWidthPx = it.width.toFloat() }
              ) {
                  Box(
                      contentAlignment = Alignment.CenterStart,
                      modifier = Modifier.fillMaxSize().padding(horizontal = 8.dp)
                  ) {
                      // Заполнение дорожки вслед за ползунком
                      Box(
                          modifier = Modifier
                              .fillMaxHeight(0.82f)
                              .fillMaxWidth((progress + 0.15f).coerceAtMost(1f))
                              .clip(RoundedCornerShape(32.dp))
                              .background(ContainerTeal.copy(alpha = 0.65f))
                      )

                      Text(
                          text = "Потяните, чтобы открыть",
                          color = TextWhite.copy(alpha = (1f - progress * 1.3f).coerceIn(0f, 1f)),
                          fontSize = 15.sp,
                          modifier = Modifier.align(Alignment.Center)
                      )

                      Surface(
                          color = AccentTeal,
                          shape = RoundedCornerShape(24.dp),
                          modifier = Modifier
                              .offset { IntOffset((progress * maxDragPx).roundToInt(), 0) }
                              .size(width = 64.dp, height = 52.dp)
                              .draggable(
                                  orientation = Orientation.Horizontal,
                                  state = rememberDraggableState { delta ->
                                      val newPx = (progress * maxDragPx + delta).coerceIn(0f, maxDragPx)
                                      onProgressChange(newPx / maxDragPx)
                                  },
                                  onDragStopped = {
                                      if (progress > 0.78f) {
                                          onProgressChange(1f)
                                          onUnlocked()
                                      } else {
                                          onProgressChange(0f)
                                      }
                                  }
                              )
                      ) {
                          Box(contentAlignment = Alignment.Center) {
                              Icon(
                                  imageVector = Icons.AutoMirrored.Filled.ArrowForward,
                                  contentDescription = null,
                                  tint = Color(0xFF0E1415)
                              )
                          }
                      }
                  }
              }
          }

          // ============================================================================
          // ЭКРАН РЕГИСТРАЦИИ И ВХОДА ПО ШАГАМ (С ПРОВЕРКОЙ @USERNAME И ПАРОЛЯ)
          // ============================================================================
          @Composable
          fun AuthFlowScreen(onComplete: (AccountProfile) -> Unit) {
              var mode by remember { mutableStateOf("WELCOME") } // WELCOME, REGISTER, LOGIN
              var regStep by remember { mutableIntStateOf(1) } // 1:@username, 2:email+pass, 3:code, 4:profile

              var username by remember { mutableStateOf("") }
              var email by remember { mutableStateOf("") }
              var password by remember { mutableStateOf("") }
              var passwordRepeat by remember { mutableStateOf("") }
              var showPass by remember { mutableStateOf(false) }
              var verifyCode by remember { mutableStateOf("") }
              var displayName by remember { mutableStateOf("") }
              var bio by remember { mutableStateOf("") }
              var errorText by remember { mutableStateOf<String?>(null) }

              Column(
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center,
                  modifier = Modifier
                      .fillMaxSize()
                      .padding(24.dp)
                      .verticalScroll(rememberScrollState())
              ) {
                  ExpressiveMorphIcon(
                      shapeType = ShapeType.SUNNY,
                      containerColor = ContainerTeal,
                      modifier = Modifier.size(136.dp)
                  ) {
                      Icon(Icons.Default.Forum, contentDescription = null, tint = AccentTeal, modifier = Modifier.size(56.dp))
                  }

                  Spacer(Modifier.height(20.dp))

                  when (mode) {
                      "WELCOME" -> {
                          Text("Messenger", color = TextWhite, fontSize = 32.sp, fontWeight = FontWeight.Bold)
                          Spacer(Modifier.height(8.dp))
                          Text(
                              "Быстрое общение в стиле Material Expressive",
                              color = TextSub,
                              fontSize = 15.sp,
                              textAlign = TextAlign.Center
                          )
                          Spacer(Modifier.height(36.dp))
                          Button(
                              onClick = { mode = "REGISTER"; regStep = 1; errorText = null },
                              colors = ButtonDefaults.buttonColors(containerColor = AccentTeal, contentColor = BgDark),
                              shape = RoundedCornerShape(50),
                              modifier = Modifier.fillMaxWidth().height(56.dp)
                          ) {
                              Text("Создать аккаунт", fontSize = 16.sp, fontWeight = FontWeight.Bold)
                          }
                          Spacer(Modifier.height(12.dp))
                          OutlinedButton(
                              onClick = { mode = "LOGIN"; errorText = null },
                              shape = RoundedCornerShape(50),
                              border = BorderStroke(1.dp, AccentTeal),
                              modifier = Modifier.fillMaxWidth().height(56.dp)
                          ) {
                              Text("Войти", color = AccentTeal, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                          }
                      }

                      "REGISTER" -> {
                          Text("Регистрация • Шаг $regStep из 4", color = AccentTeal, fontSize = 14.sp, fontWeight = FontWeight.Bold)
                          Spacer(Modifier.height(16.dp))

                          Surface(color = CardDark, shape = RoundedCornerShape(26.dp), modifier = Modifier.fillMaxWidth()) {
                              Column(modifier = Modifier.padding(20.dp)) {
                                  when (regStep) {
                                      1 -> {
                                          Text("Выберите @юзернейм", color = TextWhite, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                                          Spacer(Modifier.height(6.dp))
                                          Text("Латиница, цифры и «_», от 5 до 32 символов", color = TextSub, fontSize = 13.sp)
                                          Spacer(Modifier.height(16.dp))
                                          OutlinedTextField(
                                              value = username,
                                              onValueChange = {
                                                  username = it.lowercase().filter { c -> c.isLetterOrDigit() || c == '_' }.take(32)
                                                  errorText = null
                                              },
                                              label = { Text("@юзернейм") },
                                              singleLine = true,
                                              shape = RoundedCornerShape(50),
                                              modifier = Modifier.fillMaxWidth()
                                          )
                                          val valid = username.length >= 5 && username != "admin"
                                          Spacer(Modifier.height(8.dp))
                                          Text(
                                              text = when {
                                                  username.isEmpty() -> "Введите минимум 5 символов"
                                                  username == "admin" -> "❌ Занят"
                                                  valid -> "✓ Свободен: @$username"
                                                  else -> "Ещё ${5 - username.length} симв."
                                              },
                                              color = if (valid) AccentTeal else TextSub,
                                              fontSize = 13.sp
                                          )
                                      }

                                      2 -> {
                                          Text("Почта и пароль", color = TextWhite, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                                          Spacer(Modifier.height(14.dp))
                                          OutlinedTextField(
                                              value = email,
                                              onValueChange = { email = it; errorText = null },
                                              label = { Text("Email") },
                                              singleLine = true,
                                              shape = RoundedCornerShape(50),
                                              modifier = Modifier.fillMaxWidth()
                                          )
                                          Spacer(Modifier.height(10.dp))
                                          OutlinedTextField(
                                              value = password,
                                              onValueChange = { password = it; errorText = null },
                                              label = { Text("Пароль") },
                                              singleLine = true,
                                              visualTransformation = if (showPass) VisualTransformation.None else PasswordVisualTransformation(),
                                              trailingIcon = {
                                                  IconButton(onClick = { showPass = !showPass }) {
                                                      Icon(if (showPass) Icons.Default.VisibilityOff else Icons.Default.Visibility, null)
                                                  }
                                              },
                                              shape = RoundedCornerShape(50),
                                              modifier = Modifier.fillMaxWidth()
                                          )
                                          Spacer(Modifier.height(10.dp))
                                          OutlinedTextField(
                                              value = passwordRepeat,
                                              onValueChange = { passwordRepeat = it; errorText = null },
                                              label = { Text("Повторите пароль") },
                                              singleLine = true,
                                              visualTransformation = if (showPass) VisualTransformation.None else PasswordVisualTransformation(),
                                              shape = RoundedCornerShape(50),
                                              modifier = Modifier.fillMaxWidth()
                                          )
                                          val strength = when {
                                              password.length >= 8 -> "Надёжный пароль"
                                              password.length >= 5 -> "Средний пароль"
                                              else -> "Слишком короткий"
                                          }
                                          Spacer(Modifier.height(6.dp))
                                          Text("Надёжность: $strength", color = AccentTeal, fontSize = 12.sp)
                                      }

                                      3 -> {
                                          Text("Подтверждение почты", color = TextWhite, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                                          Spacer(Modifier.height(6.dp))
                                          Text("Введите 4-значный код, отправленный на $email (подойдёт любой из 4 цифр для демо)", color = TextSub, fontSize = 13.sp)
                                          Spacer(Modifier.height(16.dp))
                                          OutlinedTextField(
                                              value = verifyCode,
                                              onValueChange = { verifyCode = it.filter { c -> c.isDigit() }.take(4) },
                                              label = { Text("Код подтверждения") },
                                              singleLine = true,
                                              shape = RoundedCornerShape(50),
                                              modifier = Modifier.fillMaxWidth()
                                          )
                                      }

                                      4 -> {
                                          Text("Ваш профиль", color = TextWhite, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                                          Spacer(Modifier.height(14.dp))
                                          OutlinedTextField(
                                              value = displayName,
                                              onValueChange = { displayName = it },
                                              label = { Text("Ваше имя") },
                                              singleLine = true,
                                              shape = RoundedCornerShape(50),
                                              modifier = Modifier.fillMaxWidth()
                                          )
                                          Spacer(Modifier.height(10.dp))
                                          OutlinedTextField(
                                              value = bio,
                                              onValueChange = { bio = it },
                                              label = { Text("О себе (необязательно)") },
                                              singleLine = true,
                                              shape = RoundedCornerShape(50),
                                              modifier = Modifier.fillMaxWidth()
                                          )
                                      }
                                  }

                                  if (errorText != null) {
                                      Spacer(Modifier.height(10.dp))
                                      Text(errorText!!, color = Color(0xFFFF8A80), fontSize = 13.sp)
                                  }

                                  Spacer(Modifier.height(20.dp))
                                  Button(
                                      onClick = {
                                          when (regStep) {
                                              1 -> if (username.length >= 5) regStep = 2 else errorText = "Юзернейм должен быть от 5 символов"
                                              2 -> if (!email.contains("@")) errorText = "Укажите корректную почту"
                                                   else if (password.length < 5) errorText = "Пароль от 5 символов"
                                                   else if (password != passwordRepeat) errorText = "Пароли не совпадают"
                                                   else regStep = 3
                                              3 -> if (verifyCode.length == 4) regStep = 4 else errorText = "Введите 4 цифры кода"
                                              4 -> if (displayName.isBlank()) errorText = "Укажите ваше имя"
                                                   else onComplete(AccountProfile(displayName.trim(), username, email, bio))
                                          }
                                      },
                                      colors = ButtonDefaults.buttonColors(containerColor = AccentTeal, contentColor = BgDark),
                                      shape = RoundedCornerShape(50),
                                      modifier = Modifier.fillMaxWidth().height(52.dp)
                                  ) {
                                      Text(if (regStep < 4) "Далее" else "Завершить регистрацию", fontWeight = FontWeight.Bold)
                                  }
                              }
                          }
                      }

                      "LOGIN" -> {
                          Surface(color = CardDark, shape = RoundedCornerShape(26.dp), modifier = Modifier.fillMaxWidth()) {
                              Column(modifier = Modifier.padding(20.dp)) {
                                  Text("Вход в аккаунт", color = TextWhite, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                                  Spacer(Modifier.height(14.dp))
                                  OutlinedTextField(
                                      value = username,
                                      onValueChange = { username = it; errorText = null },
                                      label = { Text("Почта или @юзернейм") },
                                      singleLine = true,
                                      shape = RoundedCornerShape(50),
                                      modifier = Modifier.fillMaxWidth()
                                  )
                                  Spacer(Modifier.height(10.dp))
                                  OutlinedTextField(
                                      value = password,
                                      onValueChange = { password = it; errorText = null },
                                      label = { Text("Пароль") },
                                      singleLine = true,
                                      visualTransformation = PasswordVisualTransformation(),
                                      shape = RoundedCornerShape(50),
                                      modifier = Modifier.fillMaxWidth()
                                  )
                                  if (errorText != null) {
                                      Spacer(Modifier.height(8.dp))
                                      Text(errorText!!, color = Color(0xFFFF8A80), fontSize = 13.sp)
                                  }
                                  Spacer(Modifier.height(18.dp))
                                  Button(
                                      onClick = {
                                          if (username.length < 3 || password.length < 4) {
                                              errorText = "Проверьте логин и пароль"
                                          } else {
                                              val cleanUser = username.removePrefix("@").substringBefore("@")
                                              onComplete(AccountProfile("Makslim Zevlachkov", cleanUser, "$cleanUser@mail.ru"))
                                          }
                                      },
                                      colors = ButtonDefaults.buttonColors(containerColor = AccentTeal, contentColor = BgDark),
                                      shape = RoundedCornerShape(50),
                                      modifier = Modifier.fillMaxWidth().height(52.dp)
                                  ) {
                                      Text("Войти", fontWeight = FontWeight.Bold)
                                  }
                                  TextButton(
                                      onClick = { errorText = "Ссылка для сброса пароля отправлена на почту" },
                                      modifier = Modifier.align(Alignment.CenterHorizontally)
                                  ) {
                                      Text("Забыли пароль?", color = AccentTeal)
                                  }
                              }
                          }
                      }
                  }
              }
          }

          // ============================================================================
          // ВКЛАДКА ЧАТОВ (ПАПКИ, СЕГМЕНТИРОВАННЫЕ КАРТОЧКИ, КНОПКА СОЗДАНИЯ)
          // ============================================================================
          @Composable
          fun ChatsTabScreen(
              dialogs: MutableList<ChatDialog>,
              listState: androidx.compose.foundation.lazy.LazyListState,
              onOpenChat: (String) -> Unit,
              onNewChat: () -> Unit,
              onOpenSearch: () -> Unit,
              onToast: (String) -> Unit
          ) {
              val folders = listOf("Все", "Личные", "Группы", "Каналы")
              var selectedFolder by remember { mutableStateOf("Все") }

              val filtered = dialogs.filter {
                  selectedFolder == "Все" || it.folder == selectedFolder
              }

              LazyColumn(
                  state = listState,
                  contentPadding = PaddingValues(start = 14.dp, end = 14.dp, top = 18.dp, bottom = 110.dp),
                  modifier = Modifier.fillMaxSize()
              ) {
                  // Верхняя поисковая строка-пилюля + кнопка «Новый чат»
                  item {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Surface(
                              color = CardDark,
                              shape = RoundedCornerShape(50),
                              border = BorderStroke(1.dp, CardStroke),
                              modifier = Modifier.weight(1f).clickable(onClick = onOpenSearch)
                          ) {
                              Row(
                                  verticalAlignment = Alignment.CenterVertically,
                                  modifier = Modifier.padding(horizontal = 18.dp, vertical = 14.dp)
                              ) {
                                  Icon(Icons.Default.Search, contentDescription = null, tint = TextSub)
                                  Spacer(Modifier.width(10.dp))
                                  Text("Поиск чатов и сообщений", color = TextSub, fontSize = 15.sp)
                              }
                          }
                          Spacer(Modifier.width(10.dp))
                          Surface(
                              color = ContainerTeal,
                              shape = CircleShape,
                              modifier = Modifier.size(50.dp).clickable(onClick = onNewChat)
                          ) {
                              Box(contentAlignment = Alignment.Center) {
                                  Icon(Icons.Default.Edit, contentDescription = "Новый", tint = TextWhite)
                              }
                          }
                      }
                  }

                  // Чипы папок: Все, Личные, Группы, Каналы
                  item {
                      LazyRow(
                          horizontalArrangement = Arrangement.spacedBy(8.dp),
                          modifier = Modifier.padding(vertical = 14.dp)
                      ) {
                          items(folders) { folder ->
                              val active = selectedFolder == folder
                              Surface(
                                  color = if (active) AccentTeal else CardDark,
                                  shape = RoundedCornerShape(50),
                                  border = BorderStroke(1.dp, if (active) AccentTeal else CardStroke),
                                  modifier = Modifier.clickable { selectedFolder = folder }
                              ) {
                                  Text(
                                      text = folder,
                                      color = if (active) BgDark else TextWhite,
                                      fontWeight = FontWeight.Bold,
                                      fontSize = 14.sp,
                                      modifier = Modifier.padding(horizontal = 18.dp, vertical = 9.dp)
                                  )
                              }
                          }
                      }
                  }

                  item { SectionHeader("Диалоги (${filtered.size})") }

                  items(filtered.size) { idx ->
                      val chat = filtered[idx]
                      val lastMsg = chat.messages.lastOrNull()
                      Surface(
                          color = CardDark,
                          shape = segmentedShape(idx, filtered.size),
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(vertical = 1.5.dp)
                              .clickable { onOpenChat(chat.id) }
                      ) {
                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              modifier = Modifier.padding(horizontal = 16.dp, vertical = 14.dp)
                          ) {
                              ExpressiveMorphIcon(
                                  shapeType = chat.shape,
                                  containerColor = if (chat.isChannel) ContainerPurple else ContainerTeal,
                                  modifier = Modifier.size(52.dp)
                              ) {
                                  Text(chat.title.take(1).uppercase(), color = TextWhite, fontWeight = FontWeight.Bold, fontSize = 20.sp)
                              }

                              Column(
                                  modifier = Modifier.weight(1f).padding(horizontal = 14.dp)
                              ) {
                                  Row(verticalAlignment = Alignment.CenterVertically) {
                                      Text(chat.title, color = TextWhite, fontWeight = FontWeight.Bold, fontSize = 16.sp, maxLines = 1)
                                      if (chat.muted) {
                                          Spacer(Modifier.width(6.dp))
                                          Icon(Icons.Default.VolumeOff, null, tint = TextSub, modifier = Modifier.size(15.dp))
                                      }
                                  }
                                  Spacer(Modifier.height(3.dp))
                                  Text(
                                      text = lastMsg?.text ?: "Нет сообщений",
                                      color = TextSub,
                                      fontSize = 14.sp,
                                      maxLines = 1,
                                      overflow = TextOverflow.Ellipsis
                                  )
                              }

                              Column(horizontalAlignment = Alignment.End) {
                                  Text(lastMsg?.time ?: "", color = TextSub, fontSize = 12.sp)
                                  Spacer(Modifier.height(6.dp))
                                  if (chat.unread > 0) {
                                      Surface(color = AccentTeal, shape = CircleShape) {
                                          Text(
                                              text = chat.unread.toString(),
                                              color = BgDark,
                                              fontSize = 12.sp,
                                              fontWeight = FontWeight.Bold,
                                              modifier = Modifier.padding(horizontal = 8.dp, vertical = 3.dp)
                                          )
                                      }
                                  } else if (chat.pinned) {
                                      Icon(Icons.Default.PushPin, null, tint = TextSub, modifier = Modifier.size(16.dp))
                                  }
                              }
                          }
                      }
                  }
              }
          }

          // ============================================================================
          // ЭКРАН ВНУТРИ ЧАТА / КАНАЛА (ПУЗЫРИ, РЕАКЦИИ ХЭЛЛОУИН, ГОЛОСОВЫЕ, ОТВЕТЫ)
          // ============================================================================
          @OptIn(ExperimentalFoundationApi::class)
          @Composable
          fun ChatDetailScreen(
              chat: ChatDialog,
              onBack: () -> Unit,
              onToast: (String) -> Unit
          ) {
              var inputText by remember { mutableStateOf("") }
              var selectedMsgForReaction by remember { mutableStateOf<Long?>(null) }
              var replyTarget by remember { mutableStateOf<ChatMessage?>(null) }

              BackHandler(onBack = onBack)

              Column(modifier = Modifier.fillMaxSize().background(BgDark)) {
                  // Верхняя панель с круглой кнопкой назад
                  Row(
                      verticalAlignment = Alignment.CenterVertically,
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 14.dp, vertical = 12.dp)
                  ) {
                      Surface(
                          color = CardDark,
                          shape = CircleShape,
                          modifier = Modifier.size(44.dp).clickable(onClick = onBack)
                      ) {
                          Box(contentAlignment = Alignment.Center) {
                              Icon(Icons.AutoMirrored.Filled.ArrowBack, contentDescription = "Назад", tint = TextWhite)
                          }
                      }
                      Spacer(Modifier.width(12.dp))
                      ExpressiveMorphIcon(shapeType = chat.shape, containerColor = ContainerTeal, modifier = Modifier.size(44.dp)) {
                          Text(chat.title.take(1), color = TextWhite, fontWeight = FontWeight.Bold)
                      }
                      Spacer(Modifier.width(12.dp))
                      Column(modifier = Modifier.weight(1f)) {
                          Text(chat.title, color = TextWhite, fontWeight = FontWeight.Bold, fontSize = 17.sp)
                          Text(
                              if (chat.isChannel) "${chat.subscribers} подписчиков" else "в сети • печатает...",
                              color = AccentTeal,
                              fontSize = 12.sp
                          )
                      }
                  }

                  // Список сообщений
                  LazyColumn(
                      contentPadding = PaddingValues(16.dp),
                      verticalArrangement = Arrangement.spacedBy(10.dp),
                      modifier = Modifier.weight(1f)
                  ) {
                      items(chat.messages, key = { it.id }) { msg ->
                          Column(
                              horizontalAlignment = if (msg.isMine) Alignment.End else Alignment.Start,
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              // Пилюля с Halloween-реакциями при долгом нажатии
                              AnimatedVisibility(visible = selectedMsgForReaction == msg.id) {
                                  Surface(
                                      color = CardDark,
                                      shape = RoundedCornerShape(50),
                                      border = BorderStroke(1.dp, AccentTeal),
                                      modifier = Modifier.padding(bottom = 6.dp)
                                  ) {
                                      Row(modifier = Modifier.padding(horizontal = 12.dp, vertical = 6.dp)) {
                                          listOf("🎃", "👻", "🕸️", "🕷️", "🧛", "🍬", "❤️", "🔥").forEach { emoji ->
                                              Text(
                                                  text = emoji,
                                                  fontSize = 20.sp,
                                                  modifier = Modifier
                                                      .padding(horizontal = 5.dp)
                                                      .clickable {
                                                          val idx = chat.messages.indexOfFirst { it.id == msg.id }
                                                          if (idx != -1) {
                                                              chat.messages[idx] = msg.copy(reactions = msg.reactions + emoji)
                                                          }
                                                          selectedMsgForReaction = null
                                                      }
                                              )
                                          }
                                      }
                                  }
                              }

                              Surface(
                                  color = if (msg.isMine) ContainerTeal else CardDark,
                                  shape = RoundedCornerShape(
                                      topStart = 22.dp,
                                      topEnd = 22.dp,
                                      bottomStart = if (msg.isMine) 22.dp else 6.dp,
                                      bottomEnd = if (msg.isMine) 6.dp else 22.dp
                                  ),
                                  modifier = Modifier.combinedClickable(
                                      onClick = { replyTarget = msg },
                                      onLongClick = { selectedMsgForReaction = if (selectedMsgForReaction == msg.id) null else msg.id }
                                  )
                              ) {
                                  Column(modifier = Modifier.padding(horizontal = 16.dp, vertical = 12.dp)) {
                                      if (msg.replyTo != null) {
                                          Text("↪ ${msg.replyTo}", color = AccentTeal, fontSize = 12.sp)
                                          Spacer(Modifier.height(4.dp))
                                      }
                                      Text(msg.text, color = TextWhite, fontSize = 15.sp)
                                      Spacer(Modifier.height(4.dp))
                                      Row(verticalAlignment = Alignment.CenterVertically) {
                                          msg.reactions.forEach { r ->
                                              Text(r, fontSize = 14.sp, modifier = Modifier.padding(end = 4.dp))
                                          }
                                          Text(
                                              text = if (msg.isMine) "${msg.time} ✓✓" else msg.time,
                                              color = TextSub,
                                              fontSize = 11.sp
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }

                  // Плашка ответа
                  if (replyTarget != null) {
                      Surface(color = CardDark, modifier = Modifier.fillMaxWidth()) {
                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              modifier = Modifier.padding(horizontal = 16.dp, vertical = 8.dp)
                          ) {
                              Text("Ответ: ${replyTarget!!.text}", color = AccentTeal, fontSize = 13.sp, maxLines = 1, modifier = Modifier.weight(1f))
                              IconButton(onClick = { replyTarget = null }) {
                                  Icon(Icons.Default.Close, null, tint = TextSub)
                              }
                          }
                      }
                  }

                  // Нижняя панель ввода
                  Row(
                      verticalAlignment = Alignment.CenterVertically,
                      modifier = Modifier.fillMaxWidth().padding(12.dp)
                  ) {
                      IconButton(onClick = { onToast("Прикрепление фото / файла") }) {
                          Icon(Icons.Default.AttachFile, contentDescription = null, tint = AccentTeal)
                      }
                      OutlinedTextField(
                          value = inputText,
                          onValueChange = { inputText = it },
                          placeholder = { Text("Сообщение...") },
                          singleLine = true,
                          shape = RoundedCornerShape(50),
                          modifier = Modifier.weight(1f)
                      )
                      Spacer(Modifier.width(8.dp))
                      Surface(
                          color = AccentTeal,
                          shape = CircleShape,
                          modifier = Modifier
                              .size(50.dp)
                              .clickable {
                                  if (inputText.isNotBlank()) {
                                      chat.messages.add(
                                          ChatMessage(
                                              id = System.currentTimeMillis(),
                                              sender = "Вы",
                                              text = inputText.trim(),
                                              time = "Сейчас",
                                              isMine = true,
                                              replyTo = replyTarget?.text
                                          )
                                      )
                                      inputText = ""
                                      replyTarget = null
                                  } else {
                                      onToast("Удерживайте для записи голосового")
                                  }
                              }
                      ) {
                          Box(contentAlignment = Alignment.Center) {
                              Icon(
                                  if (inputText.isBlank()) Icons.Default.Mic else Icons.AutoMirrored.Filled.Send,
                                  contentDescription = null,
                                  tint = BgDark
                              )
                          }
                      }
                  }
              }
          }

          // ============================================================================
          // ПОИСК, КОНТАКТЫ, ПРОФИЛЬ И СОЗДАНИЕ КАНАЛА/ГРУППЫ
          // ============================================================================
          @Composable
          fun GlobalSearchScreen(
              dialogs: List<ChatDialog>,
              onBack: () -> Unit,
              onOpenChat: (String) -> Unit
          ) {
              var query by remember { mutableStateOf("") }
              BackHandler(onBack = onBack)

              Column(modifier = Modifier.fillMaxSize().background(BgDark).padding(16.dp)) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Surface(color = CardDark, shape = CircleShape, modifier = Modifier.size(44.dp).clickable(onClick = onBack)) {
                          Box(contentAlignment = Alignment.Center) {
                              Icon(Icons.AutoMirrored.Filled.ArrowBack, null, tint = TextWhite)
                          }
                      }
                      Spacer(Modifier.width(10.dp))
                      OutlinedTextField(
                          value = query,
                          onValueChange = { query = it },
                          placeholder = { Text("Поиск по @юзернейму и чатам") },
                          singleLine = true,
                          shape = RoundedCornerShape(50),
                          modifier = Modifier.weight(1f)
                      )
                  }

                  SectionHeader("Люди, каналы и группы")
                  val results = dialogs.filter {
                      it.title.contains(query, ignoreCase = true) || it.username.contains(query, ignoreCase = true)
                  }
                  results.forEachIndexed { idx, d ->
                      SegmentedSettingCard(
                          index = idx,
                          total = results.size,
                          icon = if (d.isChannel) Icons.Default.Campaign else Icons.Default.Person,
                          title = d.title,
                          subtitle = "@${d.username}",
                          onClick = { onOpenChat(d.id) }
                      )
                  }
              }
          }

          @Composable
          fun ContactsTabScreen(
              dialogs: List<ChatDialog>,
              onOpenChat: (String) -> Unit,
              onOpenSearch: () -> Unit,
              onToast: (String) -> Unit
          ) {
              LazyColumn(
                  contentPadding = PaddingValues(16.dp, 18.dp, 16.dp, 110.dp),
                  modifier = Modifier.fillMaxSize()
              ) {
                  item { SectionHeader("Контакты в сети") }
                  val people = dialogs.filter { !it.isChannel }
                  items(people.size) { idx ->
                      val p = people[idx]
                      SegmentedSettingCard(
                          index = idx,
                          total = people.size,
                          icon = Icons.Default.Person,
                          title = p.title,
                          subtitle = "@${p.username} • в сети",
                          badgeText = "Написать",
                          onClick = { onOpenChat(p.id) }
                      )
                  }
              }
          }

          @Composable
          fun ProfileTabScreen(
              account: AccountProfile,
              onUpdate: (AccountProfile) -> Unit,
              onToast: (String) -> Unit
          ) {
              var name by remember(account) { mutableStateOf(account.name) }
              var bio by remember(account) { mutableStateOf(account.bio) }

              Column(
                  horizontalAlignment = Alignment.CenterHorizontally,
                  modifier = Modifier.fillMaxSize().padding(20.dp)
              ) {
                  Spacer(Modifier.height(20.dp))
                  ExpressiveMorphIcon(shapeType = ShapeType.SUNNY, containerColor = ContainerTeal, modifier = Modifier.size(110.dp)) {
                      Text(account.name.take(1), fontSize = 40.sp, color = TextWhite, fontWeight = FontWeight.Bold)
                  }
                  Spacer(Modifier.height(12.dp))
                  Text("@${account.username}", color = AccentTeal, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                  Spacer(Modifier.height(20.dp))
                  OutlinedTextField(
                      value = name,
                      onValueChange = { name = it },
                      label = { Text("Имя профиля") },
                      shape = RoundedCornerShape(50),
                      modifier = Modifier.fillMaxWidth()
                  )
                  Spacer(Modifier.height(12.dp))
                  OutlinedTextField(
                      value = bio,
                      onValueChange = { bio = it },
                      label = { Text("О себе") },
                      shape = RoundedCornerShape(50),
                      modifier = Modifier.fillMaxWidth()
                  )
                  Spacer(Modifier.height(18.dp))
                  Button(
                      onClick = { onUpdate(account.copy(name = name, bio = bio)) },
                      colors = ButtonDefaults.buttonColors(containerColor = AccentTeal, contentColor = BgDark),
                      shape = RoundedCornerShape(50),
                      modifier = Modifier.fillMaxWidth().height(52.dp)
                  ) {
                      Text("Сохранить изменения", fontWeight = FontWeight.Bold)
                  }
              }
          }

          @Composable
          fun CreateGroupOrChannelScreen(
              onBack: () -> Unit,
              onCreate: (ChatDialog) -> Unit
          ) {
              var title by remember { mutableStateOf("") }
              var username by remember { mutableStateOf("") }
              var isChannel by remember { mutableStateOf(true) }

              BackHandler(onBack = onBack)

              Column(modifier = Modifier.fillMaxSize().background(BgDark).padding(20.dp)) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Surface(color = CardDark, shape = CircleShape, modifier = Modifier.size(44.dp).clickable(onClick = onBack)) {
                          Box(contentAlignment = Alignment.Center) {
                              Icon(Icons.AutoMirrored.Filled.ArrowBack, null, tint = TextWhite)
                          }
                      }
                      Spacer(Modifier.width(12.dp))
                      Text("Создать канал или группу", color = TextWhite, fontSize = 20.sp, fontWeight = FontWeight.Bold)
                  }
                  Spacer(Modifier.height(24.dp))
                  OutlinedTextField(
                      value = title,
                      onValueChange = { title = it },
                      label = { Text("Название") },
                      shape = RoundedCornerShape(50),
                      modifier = Modifier.fillMaxWidth()
                  )
                  Spacer(Modifier.height(12.dp))
                  OutlinedTextField(
                      value = username,
                      onValueChange = { username = it.lowercase().filter { c -> c.isLetterOrDigit() || c == '_' } },
                      label = { Text("Публичный @юзернейм") },
                      shape = RoundedCornerShape(50),
                      modifier = Modifier.fillMaxWidth()
                  )
                  Spacer(Modifier.height(16.dp))
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      Checkbox(checked = isChannel, onCheckedChange = { isChannel = it })
                      Text("Это публичный канал (пишут только админы)", color = TextWhite)
                  }
                  Spacer(Modifier.height(20.dp))
                  Button(
                      onClick = {
                          if (title.isNotBlank()) {
                              onCreate(
                                  ChatDialog(
                                      id = "custom_${System.currentTimeMillis()}",
                                      title = title.trim(),
                                      username = if (username.isBlank()) "new_channel" else username,
                                      folder = if (isChannel) "Каналы" else "Группы",
                                      isChannel = isChannel,
                                      shape = ShapeType.SUNNY,
                                      messages = mutableStateListOf(
                                          ChatMessage(1, title, "Канал создан!", "Сейчас", false)
                                      )
                                  )
                              )
                          }
                      },
                      colors = ButtonDefaults.buttonColors(containerColor = AccentTeal, contentColor = BgDark),
                      shape = RoundedCornerShape(50),
                      modifier = Modifier.fillMaxWidth().height(54.dp)
                  ) {
                      Text("Создать", fontWeight = FontWeight.Bold)
                  }
              }
          }
          EOF

      - name: Package Full Source Project into ZIP
        run: |
          zip -r Messenger-Full-Project.zip settings.gradle.kts build.gradle.kts gradle.properties app .github

      - name: Upload Full Project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Messenger-Full-Project-ZIP
          path: Messenger-Full-Project.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Compiled Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Messenger-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
